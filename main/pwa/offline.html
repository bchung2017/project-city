<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project City — Offline</title>
    <meta name="theme-color" content="#073a3b" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: #0e7c9b;
        color: #08313f;
        font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #f4efe2;
        border: 4px solid #08313f;
        box-shadow: 6px 6px 0 #08313f;
        padding: 28px 32px;
        max-width: 340px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: 0.14em;
      }
      p {
        margin: 0 0 18px;
        opacity: 0.85;
      }
      button {
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 10px 16px;
        border: 3px solid #08313f;
        background: #ffcc0f;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>■ PROJECT CITY</h1>
      <p>You're offline. The city needs a connection to load its latest data.</p>
      <button onclick="location.reload()">RETRY</button>
    </div>
  </body>
</html>
