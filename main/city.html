      // Map a project id -> style index. NOT `id % length`: that is a linear map,
      // so sequential ids (1,2,3,4...) walk sequential styles and a few projects
      // all land in one neighbourhood of the list (the bug that made every tower a
      // box). Instead step by a stride coprime to the list length: this is a
      // bijection, so any run of consecutive ids visits distinct styles with no
      // repeats until all 20 are used, and — because the list is interleaved by
      // shape — each step lands on a different shape. Deterministic in id, so a
      // project keeps its building across reloads (unlike Math.random()).
      // STRIDE must stay coprime to BSETS.length (3 & 20 share no factors).
      const STYLE_STRIDE = 3;
      const styleFor = (id) => (((id * STYLE_STRIDE) % BSETS.length) + BSETS.length) % BSETS.length;

      const TOWER_PX = {}; // sprite name -> px standing above the ground diamond

      // =================================================================
      // GIANT LOGO: a project's logo, worn across both street-facing walls.
      // The browser rastered it to an N x N grid of solid cells at upload time
      // (see list.html) and the server stores that grid, so nothing here has to
      // decode an image while a sprite is being baked — we just paint cells.
      // A cell spans `cw` face columns, and each column steps 1px down the wall,
      // so a cell comes out as a parallelogram: the logo lies IN the plane of the
      // facade rather than floating flat on top of it.
      // =================================================================
      const LOGO_MARGIN = 2; // px of bare wall kept at each end
      const LOGO_NMAX = 48; // wall is 2*a = 48px, so 48 cells is 1px each
      const BILL = {
        back: "#0F1A21", // sign face: opaque, so no window ever shows through
        face: "#8B949C", // frame
        hi: "#C6CED5", // frame, lit edge
        lo: "#5B646C", // frame, shaded edge
      };

      function logoKey(logo) {
        // The sprite cache is keyed by name, so the logo has to be part of the
        // name — otherwise re-uploading would silently keep the old tower.
        if (!logo) return "n";
        const s = logo.size + ":" + logo.cells.join(",");
        let hsh = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          hsh ^= s.charCodeAt(i);
          hsh = Math.imul(hsh, 16777619) >>> 0;
        }
        return hsh.toString(36);
      }

      function stampLogo(C, logo) {
        const { g, a, b, h, L, R } = C;
        const N = logo.size | 0;
        const cells = logo.cells;
        if (!(N >= 4 && N <= LOGO_NMAX) || !Array.isArray(cells) || cells.length !== N * N)
          return;

        // The only wall a sign can hang on is the shaft: the crown is above the
        // roof line and the lobby has the doors in it.
        const shaft = h - LOBBY_H;
        if (shaft < 12) return; // starter and 2-story towers have no wall to hang it on

        const BORDER = 1,
          BEZEL = 2,
          pad = BORDER + BEZEL; // framing on every side of the art

        // The sign is identical on both walls, so it has to fit the narrower one.
        // Cells are square on screen and can be a single pixel — a 32-cell logo is
        // 32px of a 48px wall — so we work in pixels, not 2px face columns.
        const availW = 2 * Math.min(a, b) - 2 * LOGO_MARGIN;
        const availH = shaft - 2 * LOGO_MARGIN;
        const cs = Math.floor(Math.min((availW - 2 * pad) / N, (availH - 2 * pad) / N));
        if (cs < 1) return; // wall too small to frame this many cells

        const art = N * cs,
          panW = art + 2 * pad,
          panH = art + 2 * pad;

        const at = (u, v) => (u < 0 || v < 0 || u >= N || v >= N ? null : cells[v * N + u]);

        // Visual left-to-right pixel order. On the SW wall that is ascending; on
        // the SE wall the near corner is the HIGH column, so it runs backwards.
        // Mirroring at pixel granularity (not column) keeps 1px cells honest —
        // without it the sign comes out mirrored on one of the two walls.
        const walls = [
          { px: 2 * a, pos: L, flip: false },
          { px: 2 * b, pos: R, flip: true },
        ];

        for (const w of walls) {
          const x0 = (w.px - panW) >> 1, // centred across the wall
            y0 = (shaft - panH) >> 1; // centred down the wall
          // One pixel-wide vertical slice of the wall. Each face column steps 1px
          // down, so the sign shears with the facade and lies IN its plane.
          const put = (p, yy, hh, c) => {
            if (p < 0 || p >= w.px || hh <= 0) return;
            const q = w.flip ? w.px - 1 - p : p;
            const base = w.pos(q >> 1);
            P(g, c, base[0] + (q & 1), base[1] + yy, 1, hh);
          };
          const band = (yy, hh, c) => {
            for (let p = 0; p < panW; p++) put(x0 + p, yy, hh, c);
          };

          band(y0, panH, BILL.face); // frame
          // A lit top-left edge and a shaded bottom-right one, so it reads as a
          // panel bolted to the wall rather than a decal printed on it.
          band(y0 + BORDER, 1, BILL.hi);
          band(y0 + panH - BORDER - 1, 1, BILL.lo);
          for (let t = 0; t < BEZEL; t++) {
            put(x0 + BORDER + t, y0 + BORDER, panH - 2 * BORDER, BILL.hi);
            put(x0 + panW - BORDER - 1 - t, y0 + BORDER, panH - 2 * BORDER, BILL.lo);
          }
          band(y0, BORDER, COL.out); // 1px ink border, all four sides
          band(y0 + panH - BORDER, BORDER, COL.out);
          put(x0, y0, panH, COL.out);
          put(x0 + panW - 1, y0, panH, COL.out);

          // The sign face is opaque: a transparent cell shows backing, never a
          // window. That is the whole point of the billboard.
          for (let p = 0; p < art; p++) put(x0 + pad + p, y0 + pad, art, BILL.back);

          for (let v = 0; v < N; v++) {
            for (let u = 0; u < N; u++) {
              const c = at(u, v);
              if (!c) continue;
              const yy = y0 + pad + v * cs;
              for (let t = 0; t < cs; t++) put(x0 + pad + u * cs + t, yy, cs, c);
            }
          }
        }
      }

      function towerSprite(nm, si, S, logo) {
        const set = BSETS[si];
        const a = 8 * PTX,
          b = 8 * PTY;
        // Every project shows its style's silhouette from the very first story, so
        // a low-rise city still reads as varied (round towers, obelisks, crystals…)
        // rather than a field of identical starter boxes. Completing items grows the
        // tower taller WITHIN its shape, instead of morphing a box into a shape.
        const h = LOBBY_H + (S - 1) * STORY_H;
        const room = set.crownRoom;
        const x0 = 2 * b + TMARG,
          w = 2 * (a + b) + 2 + 2 * TMARG,
          y0 = 6 + room; // y0 = the top face; the crown is built above it
        ANCHORX[nm] = 2 * a + 1 + TMARG;
        TOWER_PX[nm] = y0 + h;

        def(nm, w, y0 + a + b + h + 2, (g, ph) => {
          // cell (i,j) of a top face at (bx,by) lands at [bx + 2i - 2j, by + i + j]
          const L = (i) => [x0 + 2 * i - 2 * (b - 1), y0 + i + b]; // SW face columns
          const R = (j) => [x0 + 2 * (a - 1) - 2 * j, y0 + a + j]; // SE face columns
          const fL = (i, yy, hh, c) => {
            const p = L(i);
            P(g, c, p[0], p[1] + yy, 2, hh);
          };
          const fR = (j, yy, hh, c) => {
            const p = R(j);
            P(g, c, p[0], p[1] + yy, 2, hh);
          };
          const lit = (i, k) => (i * 7 + k * 5 + ph) % 6 < 2; // window flicker

          // The silhouette draws the whole body itself (see set.silhouette below);
          // no generic shaft is pre-drawn, so a round/tapered/faceted form isn't
          // laid over a rectangular box that would peek out behind it.

          // ---- crown scaffolding: stacked setbacks above the top face ----
          // c < 0 cantilevers out past the footprint (sky decks).
          let rise = 0;
          const step = (c, hh, cT, cL, cR) => {
            const ak = a - 2 * c,
              bk = b - 2 * c;
            if (ak < 4 || bk < 4) return null;
            rise += hh;
            const yk = y0 + 2 * c - rise;
            isoBox(g, x0, yk, ak, bk, hh, cT, cL, cR);
            return {
              ak,
              bk,
              yk,
              hh,
              cx: x0 + (ak - bk),
              cy: yk + ((ak + bk - 2) >> 1),
            };
          };
          // railing standing on a deck's outer edge — this is what reads as a balcony
          const rail = (ak, bk, yk, col) => {
            for (let i = 0; i < ak; i++) {
              const p = [x0 + 2 * i - 2 * (bk - 1), yk + i + bk];
              P(g, col, p[0], p[1] - 4, 2, 1); // hand rail
              if (i % 2 === 0) P(g, shade(col, 0.8), p[0], p[1] - 3, 1, 3); // posts
              P(g, shade(col, 0.7), p[0], p[1], 2, 1);
            }
            for (let j = 0; j < bk; j++) {
              const p = [x0 + 2 * (ak - 1) - 2 * j, yk + ak + j];
              P(g, shade(col, 0.86), p[0], p[1] - 4, 2, 1);
              if (j % 2 === 0) P(g, shade(col, 0.68), p[0] + 1, p[1] - 3, 1, 3);
              P(g, shade(col, 0.6), p[0], p[1], 2, 1);
            }
          };
          // glazed roof: top face in glass with mullions + a specular streak
          const glassCeiling = (ak, bk, yk, col) => {
            rhomb(g, x0, yk, ak, bk, col);
            const mull = shade(col, 0.66);
            for (let j = 1; j < bk; j += 3)
              for (let i = 0; i < ak; i++)
                P(g, mull, x0 + 2 * i - 2 * j, yk + i + j, 2, 1);
            for (let i = 1; i < ak; i += 3)
              for (let j = 0; j < bk; j++)
                P(g, mull, x0 + 2 * i - 2 * j, yk + i + j, 2, 1);
            for (let t = 1; t < Math.min(ak, bk) - 1; t++)
              P(g, COL.foam, x0 + 2 * t - 2 * (t + 1), yk + 2 * t + 1, 2, 1);
          };
          const mast = (mx, my, hgt, col) => {
            P(g, COL.out, mx, my - hgt, 2, hgt);
            P(g, col, mx, my - hgt + 4, 2, 2);
            P(g, ph ? COL.verm : COL.foam, mx - 1, my - hgt - 3, 3, 3); // beacon
          };

          // everything a set's silhouette / crown handler needs to draw itself
          const roofCx = x0 + (a - b),
            roofCy = y0 + ((a + b - 2) >> 1); // roof-diamond centre in screen space
          const C = { g, ph, set, a, b, h, x0, y0, S, L, R, fL, fR, lit, step, rail, glassCeiling, mast, roofCx, roofCy };

          // The set's silhouette draws the whole body — shaft, windows, lobby and
          // its bespoke crown — at any height, including a 1-story project (which is
          // just a short version of the shape). Prism/setback sets keep a flat
          // rectangular footprint; the others (cylinder, taper, pyramid, twist,
          // crystal) sculpt their own outline and ground themselves on the tile.
          set.silhouette(C);

          // The logo hangs only on flat-walled towers (prism/setback); a curved or
          // tapered facade has no plane to carry it. Painted last, over the
          // windows — signage, not a light, so it must not flicker.
          if (logo && set.flat) stampLogo(C, logo);

          // ---- base outline: flat-footprint towers get the crisp ground edge
          // here; sculpted silhouettes draw their own base. ----
          if (set.flat) {
            const c0 = L(0);
            P(g, COL.out, c0[0], c0[1], 1, h);
            for (let i = 0; i < a; i++) {
              const p = L(i);
              P(g, COL.out, p[0], p[1] + h - 1, 2, 1);
            }
            for (let j = 0; j < b; j++) {
              const p = R(j);
              P(g, COL.out, p[0], p[1] + h - 1, 2, 1);
            }
          }
        });
      }

      // =================================================================
      // =================================================================
      // BUILDING CATALOG: 20 modern->futuristic styles. Each set supplies a
      // parametric silhouette (prism / setback / cylinder / taper / pyramid /
      // twist / crystal) that draws the whole multi-story body, plus a bespoke
      // crown. Ported from the tested render harness; see towerSprite for the C
      // context each silhouette receives.
      // =================================================================
      // Hybrid parametric tower engine (prototype). A `set` supplies a palette, a
      // `silhouette` (shared, parametric — this is where prism vs non-prism lives) and
      // a bespoke `crown` (per-building signature). Geometry mirrors city.html exactly.


      // screen position of top-face cell (i,j) for a top face whose apex is (x0,y0)
      const cell = (x0, y0, i, j) => [x0 + 2 * i - 2 * j, y0 + i + j]

      // ============================ SILHOUETTES ============================
      // Each draws the whole multi-story body (shaft + windows + lobby) then calls the
      // set's bespoke crown. `wallCols(set)` gives a consistent 3-tone lighting ramp.
      const wallCols = (s) => [s.body, shade(s.body, 0.84), shade(s.body, 0.66)] // top,left,right

      // generic banded-window facade for the two flat iso faces (prism/taper/tier)
      function facadeFlat(C, opts = {}) {
        const { set, a, b, h, fL, fR, lit } = C
        const pattern = opts.pattern || 'grid'
        // draw per pixel-story down from roof line to lobby
        const shaftBot = h - LOBBY_H
        for (let yy = 2; yy < shaftBot; yy += STORY_H) {
          for (let i = 1; i < a - 1; i++) {
            const on = lit(i, yy)
            let c
            if (pattern === 'ribbon') c = (yy % STORY_H < 6) ? (on ? COL.win : shade(set.glass, 0.82)) : shade(set.body, 0.9)
            else if (pattern === 'mullion') c = (i % 2 === 1) ? (on ? COL.win : shade(set.glass, 0.8)) : shade(set.body, 0.92)
            else c = (i % 2 === 1) ? (on ? COL.win : shade(set.glass, 0.85)) : set.body
            fL(i, yy, STORY_H - 3, c)
          }
          for (let j = 1; j < b - 1; j++) {
            const on = lit(j, yy + 3)
            let c
            if (pattern === 'ribbon') c = (yy % STORY_H < 6) ? shade(set.glass, 0.62) : shade(set.body, 0.72)
            else if (pattern === 'mullion') c = (j % 2 === 1) ? shade(set.glass, 0.6) : shade(set.body, 0.74)
            else c = (j % 2 === 1) ? shade(set.glass, 0.64) : shade(set.body, 0.8)
            fR(j, yy, STORY_H - 3, c)
          }
        }
        // lobby: glazed ground floor + entrance
        const ly = h - LOBBY_H, dm = a >> 1
        for (let i = 1; i < a - 1; i++) fL(i, ly + 1, LOBBY_H - 1, i & 1 ? shade(set.glass, 0.9) : shade(set.trim, 0.9))
        for (let j = 1; j < b - 1; j++) fR(j, ly + 1, LOBBY_H - 1, j & 1 ? shade(set.glass, 0.6) : shade(set.trim, 0.7))
        for (let i = dm - 2; i <= dm + 1; i++) fL(i, ly + 5, LOBBY_H - 6, '#20242A')
        P(C.g, set.accent, C.L(dm - 2)[0], C.L(dm - 2)[1] + ly + 4, 8, 1)
      }

      function baseOutline(C) {
        const { g, a, b, h, L, R } = C
        const c0 = L(0); P(g, COL.out, c0[0], c0[1], 1, h)
        for (let i = 0; i < a; i++) { const p = L(i); P(g, COL.out, p[0], p[1] + h - 1, 2, 1) }
        for (let j = 0; j < b; j++) { const p = R(j); P(g, COL.out, p[0], p[1] + h - 1, 2, 1) }
      }

      // ---- prism: the clean rectangular baseline ----
      function silPrism(C) {
        const { g, set, x0, y0, a, b, h } = C
        const [t, l, r] = wallCols(set)
        isoBox(g, x0, y0, a, b, h, t, l, r)
        facadeFlat(C, { pattern: set.windows || 'grid' })
        ;(set.crown || crownFlatDeck)(C)
      }

      const lerp2 = (p, q, f) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f]

      // ---- taper: walls batter inward toward the top (obelisk/blade) ----
      function silTaper(C) {
        const { g, set, x0, y0, a, b, h } = C
        const [t, l, r] = wallCols(set)
        const inset = set.taper ?? 8
        const midI = (a - 1) / 2, midJ = (b - 1) / 2
        const kTop = 1 - inset / a
        const dn = (p) => [p[0], p[1] + h]
        const sc = (k, ci, cj) => cell(x0, y0, midI + (ci - midI) * k, midJ + (cj - midJ) * k)
        // bottom (full) corners projected down, and top (narrow) corners
        const bN = dn(cell(x0, y0, 0, 0)), bE = dn(cell(x0, y0, a - 1, 0)), bS = dn(cell(x0, y0, a - 1, b - 1)), bW = dn(cell(x0, y0, 0, b - 1))
        const tN = sc(kTop, 0, 0), tE = sc(kTop, a - 1, 0), tS = sc(kTop, a - 1, b - 1), tW = sc(kTop, 0, b - 1)
        fillPoly(g, [bW, bS, tS, tW], l)     // SW / left wall
        fillPoly(g, [bS, bE, tE, tS], r)     // SE / right wall
        fillPoly(g, [tN, tE, tS, tW], t)     // top face
        // horizontal ribbon windows following the batter (f: 0 bottom -> 1 top)
        const nb = Math.floor((h - 8) / STORY_H)
        for (let s = 0; s < nb; s++) {
          const fa = (s + 0.25) / nb, fb = (s + 0.75) / nb
          // left wall glass strip
          fillPoly(g, [lerp2(bW, tW, fa), lerp2(bS, tS, fa), lerp2(bS, tS, fb), lerp2(bW, tW, fb)], shade(set.glass, 0.82))
          fillPoly(g, [lerp2(bS, tS, fa), lerp2(bE, tE, fa), lerp2(bE, tE, fb), lerp2(bS, tS, fb)], shade(set.glass, 0.6))
        }
        // lobby band
        fillPoly(g, [bW, bS, lerp2(bS, tS, 0.12), lerp2(bW, tW, 0.12)], shade(set.trim, 0.85))
        fillPoly(g, [bS, bE, lerp2(bE, tE, 0.12), lerp2(bS, tS, 0.12)], shade(set.trim, 0.7))
        ;(set.crown || crownSpire)(C)
      }

      // ---- cylinder: round tower, stacked ellipse rings, glass crown ----
      // Grounded off the footprint front vertex (gb) so the round base sits ON the
      // tile instead of floating — the sprite is placed by its canvas bottom.
      function silCylinder(C) {
        const { g, set, a, b, h, roofCx, y0 } = C
        const rx = a + b - 4, ry = 12
        const cx = roofCx + 1
        const gb = y0 + a + b + h - 2 // ground bottom ≈ canvas bottom
        const baseC = gb - ry         // base cap centre
        const topC = baseC - h        // top cap centre
        const roundF = (dx) => 0.6 + 0.36 * (1 - (dx + rx) / (2 * rx)) // left lit, right dark
        for (let dx = -rx; dx <= rx; dx++) {
          const tt = dx / rx
          const colH = Math.round(ry * Math.sqrt(Math.max(0, 1 - tt * tt)))
          P(g, shade(set.body, roundF(dx)), cx + dx, topC - colH, 1, h + 2 * colH)
        }
        for (let yy = topC + 10; yy < baseC - 2; yy += STORY_H) {
          for (let dx = -rx + 3; dx <= rx - 3; dx++) {
            if ((((dx + rx) >> 1) & 1) === 0) continue // dashed
            const on = C.lit(dx, yy)
            P(g, on ? COL.win : shade(set.glass, roundF(dx)), cx + dx, yy, 1, STORY_H - 6)
          }
        }
        E(g, shade(set.body, 0.5), cx, topC + 1, rx, ry)
        E(g, set.body, cx, topC, rx, ry)
        E(g, shade(set.body, 1.06), cx, topC - 2, rx - 3, ry - 2)
        ;(set.crown || crownDome)({ ...C, roofCy: topC })
      }

      // ---- crystal: clean faceted monolith, tapering + slightly turned ----
      function silCrystal(C) {
        const { g, set, roofCx, a, b, h, y0 } = C
        const bands = Math.max(5, Math.floor(h / 9))
        const ox = roofCx + 1
        const half = (a + b) / 3.1
        const bh = h / bands
        const baseY = y0 + a + b + h - 2 - half * 0.5 // bottom band base rests on the tile
        for (let s = bands - 1; s >= 0; s--) {
          const f = s / (bands - 1)
          const th = 0.16 + f * 0.5
          const scl = 1 - 0.42 * f
          const oy = baseY - s * bh
          isoPrism(g, ox, oy, th, 0, 0, half * scl, half * scl, 0, bh + 1,
            shade(set.body, 1.02),
            (tt) => shade(set.body, 0.58 + 0.4 * (tt * 0.5 + 0.5)))
        }
        ;(set.crown || crownSpire)({ ...C, roofCy: baseY - (bands - 1) * bh - 4 })
      }

      // ---- twist: corkscrew tower, near-constant width, strong per-band rotation ----
      function silTwist(C) {
        const { g, set, roofCx, a, b, h, y0 } = C
        const bands = Math.max(6, Math.floor(h / 7))
        const ox = roofCx + 1
        const half = (a + b) / 3.0
        const bh = h / bands
        const baseY = y0 + a + b + h - 2 - half * 0.5 // bottom band rests on the tile
        for (let s = bands - 1; s >= 0; s--) {
          const f = s / (bands - 1)
          const th = f * 1.05 // twist over the height (kept under 45deg mid to avoid a pinch)
          const scl = 1 - 0.06 * f // very slight taper so the top reads
          const oy = baseY - s * bh
          isoPrism(g, ox, oy, th, 0, 0, half * scl, half * scl, 0, bh + 1,
            shade(set.body, 1.0),
            (tt) => shade(((s & 1) ? set.glass : set.body), 0.56 + 0.4 * (tt * 0.5 + 0.5)))
        }
        ;(set.crown || crownSpire)({ ...C, roofCy: baseY - (bands - 1) * bh - 4 })
      }

      // ---- pyramid: sharp taper to a near-point apex (futuristic spike) ----
      function silPyramid(C) {
        const s = C.set
        silTaper({ ...C, set: { ...s, taper: s.taper ?? 16 } })
      }

      // ---- setback: clean stepped ziggurat, widest at the base ----
      function silSetback(C) {
        const { g, set, x0, y0, a, b, h } = C
        const [t, l, r] = wallCols(set)
        const h0 = Math.round(h * 0.42), h1 = Math.round(h * 0.32), h2 = h - h0 - h1
        // draw bottom (widest, lowest) first, then up
        const tiers = [
          { c: 0, topY: y0 + h2 + h1, hh: h0 },
          { c: 4, topY: y0 + h2, hh: h1 },
          { c: 8, topY: y0, hh: h2 },
        ]
        for (const tr of tiers) {
          const ak = a - 2 * tr.c, bk = b - 2 * tr.c
          isoBox(g, x0, tr.topY, ak, bk, tr.hh, t, l, r)
          // window dashes on this tier's SW/SE faces
          for (let yy = 4; yy < tr.hh - 2; yy += STORY_H) {
            for (let i = 1; i < ak - 1; i++) { const p = cell(x0, tr.topY, i, bk - 1); P(g, (i & 1) ? shade(set.glass, 0.82) : l, p[0], p[1] + yy + bk - 1, 2, STORY_H - 4) }
            for (let j = 1; j < bk - 1; j++) { const p = cell(x0, tr.topY, ak - 1, j); P(g, (j & 1) ? shade(set.glass, 0.6) : r, p[0], p[1] + yy + ak - 1, 2, STORY_H - 4) }
          }
          P(g, set.accent, cell(x0, tr.topY, 0, bk - 1)[0], cell(x0, tr.topY, 0, bk - 1)[1] + bk, a, 1) // string course
        }
        ;(set.crown || crownFlatDeck)(C)
      }

      // ============================ CROWNS (bespoke-ish) ============================
      function crownFlatDeck(C) {
        const { g, set, roofCx, roofCy } = C
        P(g, shade(set.trim, 0.9), roofCx - 8, roofCy - 2, 16, 3)
        isoBox(g, C.x0 + 6, C.y0 + 6, C.a - 6, C.b - 6, 5, shade(set.body, 0.8), shade(set.body, 0.7), shade(set.body, 0.6))
        C.mast(roofCx, roofCy - 4, 14, set.accent)
      }
      function crownDome(C) {
        const { g, set, roofCx } = C
        const topY = C.roofCy // honors the silhouette's overridden roof centre
        const rx = C.a + C.b - 8
        E(g, shade(set.accent, 1.0), roofCx + 1, topY - 4, rx / 2, rx / 5)
        E(g, shade(set.glass, 1.0), roofCx + 1, topY - 6, rx / 2 - 3, rx / 6)
        C.mast(roofCx + 1, topY - 8, 12, set.accent)
      }
      function crownSpire(C) {
        const { g, set, roofCx, roofCy } = C
        C.mast(roofCx, roofCy - 2, 26, set.accent)
      }
      function crownAntenna(C) {
        const { set, roofCx, roofCy } = C
        C.mast(roofCx - 6, roofCy, 12, set.accent)
        C.mast(roofCx + 6, roofCy, 16, set.accent)
        C.mast(roofCx, roofCy - 2, 22, set.accent)
      }
      // clean elliptical halo ring floating on two struts above the roof
      function crownHalo(C) {
        const { g, set, roofCx, roofCy, a, b } = C
        const cx = roofCx + 1, cy = roofCy - 13
        const rx = (a + b) / 2 - 2, ry = (a + b) / 8
        P(g, shade(set.trim, 0.7), cx - 5, cy, 2, 13) // struts
        P(g, shade(set.trim, 0.6), cx + 4, cy, 2, 13)
        E(g, shade(set.accent, 0.95), cx, cy, rx, ry)
        g.globalCompositeOperation = 'destination-out'
        E(g, '#000', cx, cy, rx - 3, ry - 2)
        g.globalCompositeOperation = 'source-over'
        E(g, set.accent, cx, cy - 1, rx, 1) // lit top rim
      }
      // tilted solar sail panel
      function crownSail(C) {
        const { g, set, roofCx, roofCy } = C
        const cx = roofCx + 1
        fillPoly(g, [[cx - 12, roofCy - 4], [cx + 10, roofCy - 16], [cx + 12, roofCy - 12], [cx - 10, roofCy], ], shade(set.accent, 0.9))
        fillPoly(g, [[cx - 10, roofCy - 2], [cx + 10, roofCy - 14], [cx + 10, roofCy - 13], [cx - 10, roofCy - 1]], shade(set.glass, 1.1))
        for (let t = -8; t <= 8; t += 3) P(g, shade(set.body, 0.5), cx + t, roofCy - 8 + (t * -0.55 | 0), 1, 1)
        C.mast(cx - 12, roofCy, 8, set.trim)
      }
      // stepped sky-garden terraces (planted crown)
      function crownGarden(C) {
        const { g, set, x0, y0, a, b } = C
        const grn = ['#1FBF85', '#27AE7E', '#148F63']
        for (let s = 0; s < 3; s++) {
          const c = 3 + s * 3, ak = a - 2 * c, bk = b - 2 * c
          if (ak < 4) break
          const yk = y0 - s * 5
          isoBox(g, x0, yk - 4, ak, bk, 4, grn[s], shade(grn[s], 0.8), shade(grn[s], 0.66))
          rhomb(g, x0, yk - 4, ak, bk, grn[s])
        }
        C.mast(C.roofCx, y0 - 14, 10, set.accent)
      }
      // twin masts + cross beam (comms rig)
      function crownTwinMast(C) {
        const { roofCx, roofCy, set, g } = C
        C.mast(roofCx - 7, roofCy, 18, set.accent)
        C.mast(roofCx + 7, roofCy, 14, set.accent)
        P(g, shade(set.trim, 0.8), roofCx - 7, roofCy - 14, 16, 2)
      }
      // single beacon pylon on a small deck
      function crownBeacon(C) {
        const { g, set, roofCx, roofCy } = C
        isoBox(g, C.x0 + 8, C.y0 + 8, C.a - 8, C.b - 8, 4, shade(set.body, 0.8), shade(set.body, 0.7), shade(set.body, 0.6))
        C.mast(roofCx, roofCy - 3, 20, set.accent)
      }

      // ---- construction equipment: on the lot while items are still open ----
      function pcSprite(nm, tx, ty, marg, room, h, fn) {
        const a = 8 * tx,
          b = 8 * ty;
        const x0 = 2 * b + marg,
          w = 2 * (a + b) + 2 + 2 * marg,
          y0 = 6 + room;
        ANCHORX[nm] = 2 * a + 1 + marg;
        def(nm, w, y0 + a + b + h + 2, (g, ph) => {
          E(g, COL.sh, 2 * a + 1 + marg, y0 + a + b + h, Math.min(a, b) + 4, 2);
          fn(g, ph, x0, y0, a, b, h, x0 + (a - b), y0 + ((a + b - 2) >> 1));
        });
      }
      const HAZ = "#FFCC0F",
        HAZD = "#1E2124",
        STEEL = "#9EA6AD",
        STEELD = "#5C646C";

      // ---- tower crane ----
      // The crane is two sprites, not one. The mast is baked per height, so it
      // climbs with its tower instead of standing at a fixed 78px. The slewing
      // top — cab, jib, counter-jib, counterweight, hook — is baked at the same
      // NYAW yaw steps as the cars and stacked on the mast top by its dy, so the
      // heading bake is shared by every crane in the city rather than re-baked
      // once per mast height. Jib parts are iso prisms at arbitrary yaw, so the
      // boom sweeps the sky smoothly instead of snapping to a screen axis.
      const craneMastName = (mh) => "pcCraneM" + mh;
      // mast tops out 26px over its tower's crown, with a floor so a 1-story
      // starter still gets a crane worth looking at
      const craneMastH = (towerPx) =>
        Math.max(70, Math.min(240, Math.round(towerPx) + 26));
      function craneMast(mh) {
        const nm = craneMastName(mh);
        if (tiles[nm + "#0"]) return nm; // one bake per distinct height
        pcSprite(nm, 1, 1, 10, mh, 5, (g, ph, x0, y0, a, b, h, cx, cy) => {
          isoBox(g, x0, y0, a, b, h, HAZ, shade(HAZ, 0.8), shade(HAZ, 0.62)); // hazard pad
          for (let i = 0; i < a; i += 2)
            P(g, HAZD, x0 + 2 * i - 2 * (b - 1), y0 + i + b, 2, h);
          for (let t = 0; t < mh; t++) {
            // lattice mast
            P(g, t % 6 < 3 ? STEEL : STEELD, cx - 2, cy - t, 5, 1);
            if (t % 6 === 0) P(g, HAZD, cx - 2, cy - t, 5, 1);
          }
        });
        return nm;
      }
      // whole-pixel line: the tie-bars, drawn without canvas AA like everything else
      function pxLine(g, c, ax, ay, bx, by) {
        let x = Math.round(ax),
          y = Math.round(ay);
        const x1 = Math.round(bx),
          y1 = Math.round(by);
        const dx = Math.abs(x1 - x),
          sx = x < x1 ? 1 : -1;
        const dy = -Math.abs(y1 - y),
          sy = y < y1 ? 1 : -1;
        let e = dx + dy;
        for (;;) {
          P(g, c, x, y);
          if (x === x1 && y === y1) return;
          const e2 = 2 * e;
          if (e2 >= dy) {
            e += dy;
            x += sx;
          }
          if (e2 <= dx) {
            e += dx;
            y += sy;
          }
        }
      }
      // slew unit, in eighth-tile units about the mast top (the pivot)
      const SLEW_W = 92,
        SLEW_H = 68,
        SLEW_PX = 46, // pivot column: aligns with the mast's centre line
        SLEW_PY = 26, // pivot row: the jib rises above it, the hook hangs below
        JIB = 15, // jib reach, in eighths of a tile (~1.9 tiles)
        CJIB = 7;
      // dy that drops a slew sprite's pivot exactly onto a mast of height mh:
      // the mast sprite puts its top -10-mh px from the tile centre, and the
      // slew sprite's pivot sits SLEW_H-SLEW_PY px above its own baseline.
      const slewDy = (mh) => SLEW_H - SLEW_PY - 10 - mh;
      // The slewing top renders LIVE each frame at the crane's exact continuous
      // heading (see cranesNow) instead of snapping to one of NYAW baked yaw
      // steps, so the boom sweeps smoothly rather than clicking between fixed
      // orientations. Same jib / counter-jib / cab / hook geometry as before.
      function drawSlew(g, th, ph) {
        const co = Math.cos(th),
          si = Math.sin(th);
        const rot = (lx, ly) => [lx * co - ly * si, lx * si + ly * co];
        const SX = (u) => SLEW_PX + 2 * (u[0] - u[1]),
          SY = (u, z) => SLEW_PY + u[0] + u[1] - z;
        const depth = (lx, ly) => lx * (co + si) + ly * (co - si); // toward camera
          const steel = (t) => shade(STEEL, 0.66 + 0.16 * t);
          const dark = (t) => shade(STEELD, 0.7 + 0.18 * t);
          const box = (fx, fy, L, W, z0, z1, cT, cW) =>
            isoPrism(g, SLEW_PX, SLEW_PY, th, fx, fy, L, W, z0, z1, cT, cW);
          // lattice ticks along a beam: dark rungs marching down its top edge,
          // spaced in local x so they foreshorten with the beam as it turns
          const rungs = (x0, x1, z0, z1) => {
            for (let t = x0; t <= x1; t += 2) {
              const u = rot(t, 0);
              P(g, HAZD, SX(u), SY(u, z1), 1, Math.max(1, Math.round(z1 - z0)));
            }
          };
          const parts = [
            {
              d: depth(-CJIB - 2, 0), // counterweight slab
              f: () => box(-CJIB - 2, 0, 3, 4, 0.5, 5, HAZD, (t) => shade(HAZD, 1.5 + 0.5 * t)),
            },
            {
              d: depth(-CJIB / 2, 0), // counter-jib
              f: () => {
                box(-CJIB / 2, 0, CJIB, 1.6, 2.6, 4.2, STEEL, dark);
                rungs(-CJIB + 1, -1, 2.6, 4.2);
              },
            },
            {
              d: depth(1.6, 0), // cab, riding the slew ring
              f: () => {
                box(1.6, 0, 3.2, 2.8, -1, 3.4, STEELD, steel);
                const w = rot(1.6, co - si > 0 ? 1.4 : -1.4); // camera-facing wall
                P(g, COL.win, SX(w) - 1, SY(w, 2.4), 2, 2);
              },
            },
            {
              d: depth((2 + JIB) / 2, 0), // jib
              f: () => {
                box((2 + JIB) / 2, 0, JIB - 2, 1.5, 2.4, 4, STEEL, dark);
                rungs(3, JIB - 1, 2.4, 4);
              },
            },
            {
              d: depth(JIB - 1.5, 0), // trolley + hook block, swaying on the clock
              f: () => {
                const u = rot(JIB - 1.5, 0);
                const x = SX(u),
                  y = SY(u, 2.4),
                  drop = 16 + (ph ? 4 : 0);
                P(g, STEELD, x, y, 1, drop);
                P(g, HAZ, x - 2, y + drop, 5, 3);
              },
            },
          ];
          parts.sort((a, b) => a.d - b.d); // painter: far parts first
          for (const p of parts) p.f();
          // A-frame apex + tie-bars: above every beam, so it paints last cleanly
          box(0, 0, 1.4, 1.4, 4.4, 10, STEEL, dark);
          const apex = SX([0, 0]),
            apexY = SY([0, 0], 10);
          const tie = (lx, z) => {
            const u = rot(lx, 0);
            pxLine(g, STEELD, apex, apexY, SX(u), SY(u, z));
          };
          tie(JIB - 1, 4); // fore-stay, out to the jib tip
          tie(-CJIB + 0.5, 4.2); // back-stay
          P(g, ph ? COL.verm : COL.foam, apex - 1, apexY - 2, 2, 2); // beacon
      }
      // The slewing top is identical geometry for every crane, just rotated — so
      // bake it once per fine angle step (NSLEW steps around the circle) and SHARE
      // those sprites across all cranes, instead of redrawing each crane live every
      // frame. At 3-deg steps the motion still reads as smooth, but a city of ~85
      // cranes costs a per-step bake (once) plus a cache lookup per frame, not ~85
      // full jib redraws per frame — which is what once froze a large city.
      const NSLEW = 120;
      const SLEW_STEP = (2 * Math.PI) / NSLEW;
      function slewSprite(step, ph) {
        const nm = "pcSlew" + step;
        if (!tiles[nm + "#" + ph]) {
          const c = document.createElement("canvas");
          c.width = SLEW_W;
          c.height = SLEW_H;
          drawSlew(c.getContext("2d"), step * SLEW_STEP, ph);
          tiles[nm + "#" + ph] = c;
          ANCHORX[nm] = SLEW_PX + 1;
        }
        return nm;
      }

      pcSprite("pcScaff", 1, 1, 10, 34, 4, (g, ph, x0, y0, a, b, h, cx, cy) => {
        isoBox(g, x0, y0, a, b, h, "#8A6238", "#6E4A2E", "#523620");
        for (let lv = 0; lv < 3; lv++) {
          const yy = cy - 10 * lv - 8;
          for (let i = -10; i <= 10; i++) P(g, i % 5 === 0 ? STEELD : STEEL, cx + i, yy, 1, 2); // deck
          P(g, "#C9A227", cx - 10, yy - 1, 21, 1); // plank
          P(g, STEELD, cx - 10, yy, 1, 10); // uprights
          P(g, STEELD, cx + 9, yy, 1, 10);
          if (lv === 1) P(g, ph ? HAZ : COL.verm, cx + 2, yy - 3, 3, 3); // worker lamp
        }
        P(g, HAZ, cx - 11, cy - 2, 22, 2);
      });

      pcSprite("pcBarrier", 1, 1, 8, 14, 3, (g, ph, x0, y0, a, b, h, cx, cy) => {
        isoBox(g, x0, y0, a, b, h, "#C6C0AE", "#9EA6AD", "#7C848C");
        for (let i = 0; i < 3; i++) {
          const bx = cx - 9 + i * 7;
          P(g, HAZD, bx, cy - 9, 6, 9); // A-frame barrier
          P(g, i & 1 ? COL.verm : HAZ, bx, cy - 7, 6, 3);
          P(g, COL.foam, bx + 1, cy - 9, 4, 1);
        }
        P(g, ph ? COL.verm : shade(COL.verm, 0.5), cx - 2, cy - 12, 3, 3); // flasher
      });

      pcSprite("pcMats", 1, 1, 8, 18, 4, (g, ph, x0, y0, a, b, h, cx, cy) => {
        isoBox(g, x0, y0, a, b, h, "#8A6238", "#6E4A2E", "#523620");
        isoBox(g, x0 + 2, y0 - 6, 5, 5, 6, STEEL, STEELD, shade(STEELD, 0.8)); // girder stack
        for (let k = 0; k < 4; k++) P(g, HAZ, cx - 8 + k * 4, cy - 12 - k, 3, 2);
        E(g, "#B04A2A", cx + 7, cy - 6, 4, 3); // sand pile
        E(g, "#D06A3A", cx + 7, cy - 7, 3, 2);
        P(g, ph ? HAZ : shade(HAZ, 0.7), cx - 11, cy - 8, 2, 6); // rebar bundle
      });

      // PLOTS / lotGear are defined up with the street furniture, which reserves
      // the hoarding tiles before benches and lamps get scattered.
      let PROJECTS = [],
        projObjs = [],
        craneRigs = [], // one per crane: its tile, mast height, and slew phase
        skylinePx = 0;

      let lastSkylinePx = -1;
      function rebuildProjects(list) {
        // Grow/shrink the city grid to fit the project count (up to 100 blocks).
        // Rebuilding regenerates the map + PLOTS; buildGround re-rasterizes it.
        const wantGrid = gridForCount(list.length);
        const gridChanged = wantGrid !== GRID;
        if (gridChanged) buildCity(wantGrid); // regenerate map data; ground rasterized below
        PROJECTS = list;
        projObjs = [];
        craneRigs = [];
        skylinePx = 0;
        list.forEach((p, idx) => {
          const lot = PLOTS[idx];
          if (!lot || !p.render_progress) return; // toggle off -> no progress rendered
          const si = styleFor(p.id);
          const S = Math.max(1, Math.min(MAX_STORIES, p.stories | 0));
          const logo = p.logo && Array.isArray(p.logo.cells) ? p.logo : null;
          const nm = "proj" + p.id + "_" + si + "_" + S + "_" + logoKey(logo);
          if (!tiles[nm + "#0"]) towerSprite(nm, si, S, logo);
          // The hover/active halo is baked lazily in draw() for the one active
          // tower — baking a halo for all ~85 buildings up front was pure load-time
          // cost for sprites almost none of which are ever highlighted.
          const { px, py } = lot;
          // A 3x3 tower cannot sit centred on a 4x4 pad at whole-tile steps: the
          // old south corner at (px+2,py+2) left a full pad row bare on each of
          // the two street-facing sides. Half-tile steps centre it exactly — the
          // pad and the block share a centre, and a +0.5/+0.5 shift is pure
          // screen-y in iso, so the sprite stays on the pixel grid.
          // pid tags this object as pickable: the tower is the project's handle.
          projObjs.push({ s: nm, x: px + 2.5, y: py + 2.5, dy: 8, pid: p.id }); // 3x3, centred
          skylinePx = Math.max(skylinePx, TOWER_PX[nm]);

          const open = p.open | 0;
          if (open > 0) {
            const G = lotGear(lot);
            // The mast is a plain object; its slewing top is drawn per frame by
            // cranesNow(), which lands on the same tile and so sorts right after
            // the mast (equal depth key, stable sort) — on top of it, as it should.
            const mh = craneMastH(TOWER_PX[nm]);
            craneRigs.push({ x: G.crane[0], y: G.crane[1], mh, th0: p.id * 1.7 });
            skylinePx = Math.max(skylinePx, mh + 30); // keep the jib in frame
            const eq = [[craneMast(mh), ...G.crane]];
            if (open >= 2) eq.push(["pcScaff", ...G.scaff]);
            if (open >= 3) eq.push(["pcMats", ...G.mats]);
            for (let k = 0; k < Math.min(G.barriers.length, open - 1); k++)
              eq.push(["pcBarrier", ...G.barriers[k]]);
            for (const [s, x, y] of eq) projObjs.push({ s, x, y, dy: 6 });
          }
        });
        // buildGround re-sizes the canvas, recomputes the zoom-to-fit and re-
        // rasterizes the whole static map — expensive. It only needs to run when the
        // grid or the skyline height (which drives the fit) actually changed, NOT on
        // every 4s poll where nothing moved. (Window resize has its own listener.)
        if (gridChanged || skylinePx !== lastSkylinePx) {
          buildGround();
          lastSkylinePx = skylinePx;
        }
        renderPanel();
      }

      // Every crane slews: a slow sinusoidal sweep, each rig on its own phase, so
      // the lot never looks like a row of metronomes. The heading is continuous —
      // and now so is the render: the slewing top is redrawn live at the exact
      // angle each frame (drawSlew) rather than snapped to a baked yaw step, so the
      // boom glides between positions. ~0.24 rad/s at the fastest, a real crane's pace.
      function cranesNow(tms) {
        return craneRigs.map((r) => {
          const th = r.th0 + 2 * Math.sin(tms * 0.00012 + r.th0);
          const step = ((Math.round(th / SLEW_STEP) % NSLEW) + NSLEW) % NSLEW;
          // Ensure both phases of this step are baked (cheap: once per step, then
          // reused by every crane at that angle forever). The 280ms phase swap is
          // what animates the hook drop / beacon, so the blit needs both.
          slewSprite(step, 0);
          const nm = slewSprite(step, 1);
          return { s: nm, x: r.x, y: r.y, dy: slewDy(r.mh) };
        });
      }

      async function loadProjects() {
        try {
          const r = await fetch("/api/projects", { cache: "no-store" });
          if (!r.ok) return;
          rebuildProjects(await r.json());
        } catch (e) {
          /* served standalone: the city just renders without towers */
        }
      }

      // ---- HUD: per-project render toggle ----
      const $plist = document.getElementById("pclist");
      function renderPanel() {
        $plist.replaceChildren();
        if (!PROJECTS.length) {
          const d = document.createElement("div");
          d.className = "pcrow pcempty";
          d.textContent = "NO PROJECTS — LAND IS ZONED";
          $plist.append(d);
          return;
        }
        PROJECTS.forEach((p, idx) => {
          const row = document.createElement("div");
          row.className = "pcrow" + (p.render_progress ? "" : " off");
          const nm = document.createElement("span");
          nm.className = "pcname";
          const built = p.items.filter((i) => i.done).length;
          nm.textContent = p.title;
          const st = document.createElement("span");
          st.className = "pcstat";
          st.textContent =
            idx >= PLOTS.length
              ? "NO LOT"
              : p.stories + "F " + built + "/" + p.items.length;
          const btn = document.createElement("button");
          btn.className = "pctog";
          btn.textContent = p.render_progress ? "ON" : "OFF";
          btn.title = "Render this project's progress in the city";
          btn.onclick = async () => {
            btn.disabled = true;
            await fetch("/api/projects/" + p.id, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ render_progress: !p.render_progress }),
            });
            loadProjects();
          };
          row.append(nm, st, btn);
          $plist.append(row);
        });
      }

      // =================================================================
      // RENDER: ground prerendered per phase; RAF at display rate.
      // Sprite flips stay on a 280ms retro clock; motion (cars, falls)
      // interpolates every frame.
      // =================================================================
      const cv = document.getElementById("cv");
      const ctx = cv.getContext("2d");

      const SKIRTS = {
        rock: (i) =>
          i % 6 === 0 ? COL.cliffB : i < TW / 2 ? COL.cliffL : COL.rockD,
        earth: (i) =>
          i % 7 === 0 ? COL.earthD : i < TW / 2 ? COL.earthL : COL.earthR,
        fall: (i) => {
          const m = i % 8;
          return m < 1 ? COL.foam : m < 5 ? "#2FA8EC" : COL.waterHL;
        },
      };
      function drawSkirtTo(g, X, Y, hpx, s, style) {
        const pick = SKIRTS[style];
        // Column edges are snapped to whole pixels so half-step zoom levels
        // (s = 1.5, 0.5) can't open hairline seams down a cliff face.
        for (let i = 0; i < TW; i++) {
          const xa = Math.round(X + i * s),
            xb = Math.round(X + (i + 1) * s);
          g.fillStyle = pick(i);
          g.fillRect(xa, Math.round(Y + (edgeY(i) + 1) * s), Math.max(1, xb - xa), hpx);
        }
      }

      let VP = null;
      const groundLayer = [null, null];
      let fallRects = [];

      // ---- camera: pan + zoom -------------------------------------------------
      // The district is fit on first build; the viewer can then DRAG to pan and
      // WHEEL to zoom (quarter-step snapped, per the seam invariant) out to the
      // biome ring and back. Only the ground is pre-baked at the camera offset —
      // sprites already draw through (ox,oy,s), so they pan/zoom for free. The
      // baked ground layer is oversized by MARGIN on every side, so a same-scale
      // pan is a lossless bitmap shift of the cache (no rebake, no seams) until it
      // nears the edge; then a rebake recentres it. A zoom changes scale, so it
      // always rebakes. Baking still happens at the (quarter-snapped) camera scale,
      // but only on settle/zoom, never per pan frame — so no stall while dragging.
      const MARGIN = 340; // px of baked ground beyond each screen edge
      let cam = null; // {s, ox, oy} live camera; null until the first fit
      let baked = null; // {s, ox, oy} the offset groundLayer was last baked at
      let groundDirty = false; // request a rebake before the next frame

      // Frame the district (not the whole map): the city fills the screen, and the
      // surrounding biomes are discovered by panning/zooming out.
      function fitDistrict(W, H) {
        const raw = Math.min(
          W / (CITY * TW + 68),
          H / (CITY * TH + 96 + skylinePx),
        );
        const s = Math.max(0.25, Math.floor(raw * 4) / 4);
        const ccx = CX0 + CITY / 2,
          ccy = CY0 + CITY / 2;
        return {
          s,
          ox: Math.round(W / 2 - (ccx - ccy) * (TW / 2) * s),
          oy: Math.round(
            H / 2 - (ccx + ccy) * (TH / 2) * s + (skylinePx * s) / 2,
          ),
        };
      }
      // Zoom out far enough to take in the whole extended map incl. biomes.
      function minScale(W, H) {
        const raw = Math.min(
          W / ((MW + MH) * (TW / 2) + 60),
          H / ((MW + MH) * (TH / 2) + 60),
        );
        return Math.max(0.25, Math.floor(raw * 4) / 4);
      }
      const MAX_SCALE = 2;
      // Keep the map overlapping the viewport — you can pan the biomes to the edge
      // but never fling the whole world into the void.
      function clampCam() {
        const W = VP.W,
          H = VP.H,
          hw = (TW / 2) * cam.s,
          hh = (TH / 2) * cam.s,
          PAD = 140;
        cam.ox = Math.max(
          PAD - (MW - 1) * hw,
          Math.min(W - PAD + (MH - 1) * hw, cam.ox),
        );
        cam.oy = Math.max(
          PAD - (MW + MH - 2) * hh,
          Math.min(H - PAD, cam.oy),
        );
      }

      // Rasterize the ground at the current camera into an oversized (screen +
      // 2*MARGIN) layer per phase. Waterfall strips are stored in tile coords and
      // projected each frame so they track pan/zoom.
      function bakeGround() {
        const W = VP.W,
          H = VP.H,
          s = cam.s;
        const ox = cam.ox + MARGIN,
          oy = cam.oy + MARGIN,
          LW = W + 2 * MARGIN,
          LH = H + 2 * MARGIN;
        baked = { s, ox: cam.ox, oy: cam.oy };
        fallRects = [];
        for (let ph = 0; ph < 2; ph++) {
          const c = document.createElement("canvas");
          c.width = LW;
          c.height = LH;
          const g = c.getContext("2d");
          g.imageSmoothingEnabled = false;
          for (let d = 0; d <= MW + MH - 2; d++)
            for (
              let y = Math.max(0, d - MW + 1);
              y <= Math.min(d, MH - 1);
              y++
            ) {
              const x = d - y;
              const X = ox + (x - y) * (TW / 2) * s,
                Y = oy + (x + y) * (TH / 2) * s - elev[y][x] * EH * s;
              if (
                X + TW * s < 0 ||
                X > LW ||
                Y + (TH + elev[y][x] * EH) * s < 0 ||
                Y > LH
              )
                continue;
              if (elev[y][x] > 0) {
                drawSkirtTo(g, X, Y, elev[y][x] * EH * s, s, skirt[y][x]);
                if (ph === 0 && skirt[y][x] === "fall") {
                  // Only the strip of skirt that clears the tile in front is on
                  // screen; the rest is buried under terrain drawn later. The
                  // halves are hidden by different neighbours -- left by (x,y+1),
                  // right by (x+1,y) -- so each gets its own exposed height.
                  const e = elev[y][x];
                  const dL = Math.max(0, e - ((elev[y + 1] || [])[x] || 0));
                  const dR = Math.max(0, e - (elev[y][x + 1] || 0));
                  if (dL > 0 || dR > 0) fallRects.push({ x, y, dL, dR });
                }
              }
              g.drawImage(tiles[ground[y][x] + "#" + ph], X, Y, TW * s, TH * s);
            }
          groundLayer[ph] = c;
        }
        groundDirty = false;
      }

      function buildGround() {
        const W = window.innerWidth,
          H = window.innerHeight;
        cv.width = W;
        cv.height = H;
        cv.style.touchAction = "none"; // let a touch-drag pan instead of scroll
        if (!cam) cam = fitDistrict(W, H); // first build only — never yank the view
        VP = { W, H, s: cam.s, ox: cam.ox, oy: cam.oy };
        clampCam();
        bakeGround();
      }

      function draw(tms) {
        VP.s = cam.s; // the camera can move between bakes; the sprite pass and
        VP.ox = cam.ox; // picking read VP, so keep it in lockstep with cam.
        VP.oy = cam.oy;
        const { s, ox, oy } = VP;
        const slow = Math.floor(tms / 280);
        ctx.imageSmoothingEnabled = false;
        // Void backdrop under any over-pan (the map no longer fills the screen).
        ctx.fillStyle = "#062a2b";
        ctx.fillRect(0, 0, VP.W, VP.H);
        // Blit the oversized baked ground, shifted by how far the camera has moved
        // since it was baked — a same-scale pan is a lossless bitmap translate.
        ctx.drawImage(
          groundLayer[slow & 1],
          Math.round(ox - baked.ox - MARGIN),
          Math.round(oy - baked.oy - MARGIN),
        );

        ctx.fillStyle = COL.foam; // waterfall: smooth fall, clipped to the visible face
        for (const r of fallRects) {
          const rX = ox + (r.x - r.y) * (TW / 2) * s,
            rY = oy + (r.x + r.y) * (TH / 2) * s - elev[r.y][r.x] * EH * s,
            expL = r.dL * EH * s,
            expR = r.dR * EH * s;
          for (let i = 2; i < TW; i += 5) {
            const h = i < TW / 2 ? expL : expR;
            if (h <= 0) continue;
            const off = (i * 7 * s + tms * 0.05 * s) % h;
            ctx.fillRect(
              Math.round(rX + i * s),
              Math.round(rY + (edgeY(i) + 1) * s + off),
              Math.max(1, Math.round(s)),
              Math.min(Math.max(1, Math.round(2 * s)), h - off),
            );
          }
        }

        const sx = (x, y) => ox + (x - y) * (TW / 2) * s;
        const sy = (x, y) => oy + (x + y) * (TH / 2) * s;
        const frame = objs
          .concat(projObjs)
          .concat(trafficNow(tms))
          .concat(cranesNow(tms)) // last: a slew unit ties with its own mast, and
          .sort((a, b) => a.x + a.y - (b.x + b.y) || a.y - b.y); // a stable sort keeps it on top
        const act = activePid();
        for (const o of frame) {
          let lit = null;
          if (o.pid !== undefined && o.pid === act) {
            // Bake the halo on demand — only the active tower needs one.
            if (!tiles[o.s + "@hi#0"]) bakeHalo(o.s, o.s + "@hi");
            if (tiles[o.s + "@hi#0"]) lit = o.s + "@hi";
          }
          const nm = lit || o.s;
          const sp = tiles[nm + "#" + ((Math.floor(o.x + o.y) + slow) & 1)];
          const ex = (elev[Math.round(o.y)] || [])[Math.round(o.x)] || 0;
          const cx = sx(o.x, o.y) + (TW / 2) * s;
          const cy = sy(o.x, o.y) + (TH / 2) * s - ex * EH * s;
          const axr = ANCHORX[nm] !== undefined ? ANCHORX[nm] : sp.width / 2;
          ctx.drawImage(
            sp,
            Math.round(cx - axr * s),
            Math.round(cy + (o.dy || 6) * s - sp.height * s),
            Math.round(sp.width * s),
            Math.round(sp.height * s),
          );
        }
        updateHandshake();
      }

      // =================================================================
      // BUILDING HIGHLIGHT: silhouette halo on hover (saffron/white pulse on the
      // 280ms clock) for the project towers.
      // =================================================================
      // Silhouette halo: the sprite smeared 1px in every direction and flooded
      // flat (saffron on phase 0, white on phase 1 -> it pulses on the 280ms
      // clock), with the sprite laid back on top. Grows the canvas by 1px on
      // each side, so the anchor shifts with it.
      function bakeHalo(base, out) {
        for (let ph = 0; ph < 2; ph++) {
          const src = tiles[base + "#" + ph];
          if (!src) return false;
          const sil = document.createElement("canvas");
          sil.width = src.width;
          sil.height = src.height;
          const sg = sil.getContext("2d");
          sg.drawImage(src, 0, 0);
          sg.globalCompositeOperation = "source-in";
          sg.fillStyle = ph ? "#FFFFFF" : COL.saff;
          sg.fillRect(0, 0, sil.width, sil.height);
          const c = document.createElement("canvas");
          c.width = src.width + 2;
          c.height = src.height + 1;
          const g = c.getContext("2d");
          g.imageSmoothingEnabled = false;
          for (const [dx, dy] of [
            [0, 1],
            [2, 1],
            [1, 0],
            [0, 0],
            [2, 0],
          ])
            g.drawImage(sil, dx, dy);
          g.drawImage(src, 1, 1);
          tiles[out + "#" + ph] = c;
        }
        const a0 = ANCHORX[base];
        ANCHORX[out] =
          (a0 !== undefined ? a0 : tiles[base + "#0"].width / 2) + 1;
        return true;
      }

      // ---- generic sprite picking: screen rect + per-pixel alpha ----
      const spriteMasks = {};
      function objRect(o) {
        const { s, ox, oy } = VP,
          sp = tiles[o.s + "#0"];
        const a0 = ANCHORX[o.s] !== undefined ? ANCHORX[o.s] : sp.width / 2;
        const ex = (elev[Math.round(o.y)] || [])[Math.round(o.x)] || 0;
        const cx = ox + (o.x - o.y) * (TW / 2) * s + (TW / 2) * s;
        const cy =
          oy + (o.x + o.y) * (TH / 2) * s + (TH / 2) * s - ex * EH * s;
        return {
          X: Math.round(cx - a0 * s),
          Y: Math.round(cy + (o.dy || 6) * s - sp.height * s),
          w: sp.width,
          h: sp.height,
          s,
        };
      }
      function hitObj(o, mx, my) {
        if (!VP || !tiles[o.s + "#0"]) return false;
        const r = objRect(o);
        const lx = Math.floor((mx - r.X) / r.s),
          ly = Math.floor((my - r.Y) / r.s);
        if (lx < 0 || ly < 0 || lx >= r.w || ly >= r.h) return false;
        let m = spriteMasks[o.s];
        if (!m) {
          try {
            m = spriteMasks[o.s] = tiles[o.s + "#0"]
              .getContext("2d")
              .getImageData(0, 0, r.w, r.h).data;
          } catch (e) {
            return true;
          } // no pixel access: bbox is good enough
        }
        return m[(ly * r.w + lx) * 4 + 3] > 0;
      }
      // Towers overlap, so test them front-to-back: the one drawn last (largest
      // x+y) is the one on top, and it wins the pointer.
      function pickTower(mx, my) {
        const ts = projObjs
          .filter((o) => o.pid !== undefined)
          .sort((a, b) => b.x + b.y - (a.x + a.y) || b.y - a.y);
        for (const o of ts) if (hitObj(o, mx, my)) return o;
        return null;
      }

      // =================================================================
      // HANDSHAKE: hover a project tower -> it lights up and a callout card
      // wires itself to the crown with a leader line. Click -> open that
      // project on the list page. A tower can also arrive pre-selected via
      // /city#p<id>, which is the link back from a project card.
      // =================================================================
      const $pcc = document.getElementById("pcc"),
        $pccard = document.getElementById("pccard"),
        $pccpath = document.getElementById("pccpath"),
        $pccdot = document.getElementById("pccdot"),
        $pcctitle = document.getElementById("pcctitle"),
        $pccstats = document.getElementById("pccstats"),
        $pccfill = document.getElementById("pccfill"),
        $pccitems = document.getElementById("pccitems");

      let hoverPid = null, // tower under the pointer
        pinPid = hashPid(), // tower selected by the incoming #p<id> link
        cardSig = ""; // what the card currently shows

      function hashPid() {
        const m = /^#p(\d+)$/.exec(location.hash || "");
        return m ? +m[1] : null;
      }
      function activePid() {
        return hoverPid !== null ? hoverPid : pinPid;
      }
      function towerOf(pid) {
        return projObjs.find((o) => o.pid === pid);
      }

      function fillCard(p) {
        const built = p.items.filter((i) => i.done).length;
        const total = p.items.length;
        // Signature: only rebuild the card's DOM when what it says changes.
        const sig = [p.id, p.title, p.stories, built, total, p.open].join("|");
        if (sig === cardSig) return;
        cardSig = sig;

        $pcctitle.textContent = p.title;
        $pccstats.replaceChildren(
          ...[
            ["Height", p.stories + "F"],
            ["Built", built + " / " + total],
            ["Open", String(p.open)],
          ].map(([k, v]) => {
            const row = document.createElement("div");
            row.className = "pccrow";
            const a = document.createElement("span");
            a.className = "pcck";
            a.textContent = k;
            const b = document.createElement("span");
            b.className = "pccv";
            b.textContent = v;
            row.append(a, b);
            return row;
          }),
        );
        $pccfill.style.width = (total ? (built / total) * 100 : 0) + "%";

        const SHOW = 5;
        const lis = p.items.slice(0, SHOW).map((i) => {
          const li = document.createElement("li");
          if (i.done) li.className = "done";
          const x = document.createElement("span");
          x.className = "pcx";
          x.textContent = i.done ? "✓" : "·";
          const t = document.createElement("span");
          t.textContent =
            i.done || !i.completion
              ? i.text
              : i.text + " (" + Math.round(i.completion * 100) + "%)";
          li.append(x, t);
          return li;
        });
        if (total > SHOW) {
          const li = document.createElement("li");
          li.className = "more";
          li.textContent = "+" + (total - SHOW) + " MORE";
          lis.push(li);
        }
        $pccitems.replaceChildren(...lis);
      }

      // Re-anchored every frame so the card tracks zoom, resize and growth.
      function placeCard(o) {
        const r = objRect(o);
        const ax = Math.round(r.X + (r.w * r.s) / 2), // crown, horizontal centre
          ay = Math.round(r.Y + 3 * r.s);
        const cw = $pccard.offsetWidth,
          ch = $pccard.offsetHeight;
        const W = VP.W,
          H = VP.H,
          GAP = 38;
        // Prefer the right of the tower; fall back to the left when it won't fit.
        const right = ax + GAP + cw <= W - 12;
        const cx = right
          ? ax + GAP
          : Math.max(12, Math.min(ax - GAP - cw, W - cw - 12));
        const cy = Math.max(12, Math.min(ay - 24, H - ch - 12));
        $pccard.style.left = cx + "px";
        $pccard.style.top = cy + "px";

        // Leader line: up the tower's axis, then a right-angle run into the card.
        const ey = Math.round(cy + 16); // meets the card beside its title
        const ex = right ? cx : cx + cw;
        $pccpath.setAttribute(
          "points",
          ax + "," + ay + " " + ax + "," + ey + " " + ex + "," + ey,
        );
        $pccdot.setAttribute("cx", ax);
        $pccdot.setAttribute("cy", ay);
      }

      function updateHandshake() {
        const pid = activePid();
        const o = pid === null ? null : towerOf(pid);
        const p = o ? PROJECTS.find((q) => q.id === pid) : null;
        if (!o || !p) {
          // no lot, toggled off, or deleted out from under us
          $pcc.style.display = "none";
          cardSig = "";
          return;
        }
        fillCard(p);
        placeCard(o);
        $pcc.style.display = "block";
      }

      // ---- pointer: hover-pick + drag-pan, wheel-zoom -------------------------
      // One pointer does double duty: a press-and-move pans the camera, a press
      // that doesn't move is a click (hover/navigate to the project). The drag
      // threshold keeps a slightly-shaky click from being read as a pan.
      let dragging = false,
        dragMoved = false,
        lastX = 0,
        lastY = 0;
      if (cv.addEventListener) {
        cv.addEventListener("pointerdown", (e) => {
          dragging = true;
          dragMoved = false;
          lastX = e.clientX;
          lastY = e.clientY;
          try {
            cv.setPointerCapture(e.pointerId);
          } catch (_) {}
          cv.style.cursor = "grabbing";
        });
        cv.addEventListener("pointermove", (e) => {
          if (dragging) {
            const dx = e.clientX - lastX,
              dy = e.clientY - lastY;
            if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
            lastX = e.clientX;
            lastY = e.clientY;
            cam.ox += dx;
            cam.oy += dy;
            clampCam();
            // Rebake before the pan reaches the baked margin, or the edge shows void.
            if (
              Math.abs(cam.ox - baked.ox) > MARGIN * 0.7 ||
              Math.abs(cam.oy - baked.oy) > MARGIN * 0.7
            )
              groundDirty = true;
            return;
          }
          const t = pickTower(e.clientX, e.clientY);
          const pid = t ? t.pid : null;
          if (pid !== null && pid !== pinPid) pinPid = null; // hover supersedes the link
          hoverPid = pid;
          cv.style.cursor = pid !== null ? "pointer" : "grab";
        });
        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          cv.style.cursor = "grab";
          groundDirty = true; // recentre the oversized margin for the next drag
        };
        cv.addEventListener("pointerup", (e) => {
          const wasDrag = dragMoved;
          endDrag();
          if (wasDrag) return; // a pan, not a click — don't navigate
          const t = pickTower(e.clientX, e.clientY);
          if (t) {
            location.href = "/#p" + t.pid; // hand off to the list page
            return;
          }
          pinPid = null;
        });
        cv.addEventListener("pointercancel", endDrag);
        cv.addEventListener("pointerleave", () => {
          if (!dragging) hoverPid = null;
        });
        cv.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const raw = cam.s * (e.deltaY < 0 ? 1.25 : 0.8);
            const ns = Math.max(
              minScale(VP.W, VP.H),
              Math.min(MAX_SCALE, Math.max(0.25, Math.floor(raw * 4) / 4)),
            );
            if (ns === cam.s) return;
            // Zoom toward the cursor: keep the world point under the mouse fixed.
            const k = ns / cam.s;
            cam.ox = e.clientX - (e.clientX - cam.ox) * k;
            cam.oy = e.clientY - (e.clientY - cam.oy) * k;
            cam.s = ns;
            clampCam();
            groundDirty = true; // scale changed — the cache must be re-rasterized
          },
          { passive: false },
        );
      }
      window.addEventListener("hashchange", () => {
        pinPid = hashPid();
      });

      window.addEventListener("resize", buildGround);
      buildGround();
      requestAnimationFrame(function loop(t) {
        if (groundDirty) bakeGround(); // coalesce pan/zoom rebakes to one per frame
        draw(t);
        requestAnimationFrame(loop);
      });

      // Projects are edited on the list page; poll so the city keeps up, and
      // catch up immediately when this tab comes back to the front.
      loadProjects();
      setInterval(loadProjects, 4000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) loadProjects();
      });
    </script>
