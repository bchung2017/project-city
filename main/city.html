          faceSW(5, 10, 12, h + 2, h + 5, CH.wallD);
          faceSE(7, 12, 10, h + 2, h + 5, CH.deck);
        }

        // ---- tabernacle: long gabled hall. Walls carry the blue base course;
        // the roof shows its near slope, its ridge and a sliver of the far
        // slope, which is all the camera can see of a gable this pitch. -------
        {
          const u0 = 25,
            u1 = 44,
            v0 = 5,
            v1 = 17,
            vm = 11,
            zE = 16,
            zR = 24;
          faceSW(u0, u1, v1, 0, zE, CH.wallT);
          faceSE(v0, v1, u1, 0, zE, CH.wallD);
          faceSW(u0, u1, v1, 0, 5, CH.band);
          faceSE(v0, v1, u1, 0, 5, CH.bandD);
          winSW(27, 43, v1, 7, 12, 4, 2);
          // gable end, then the roof laid over it with a verge overhang
          fillPoly(
            g,
            [pt(u1, v0, zE), pt(u1, vm, zR), pt(u1, v1, zE)],
            CH.wallD,
          );
          const rL = pt(u0 - 1, vm, zR),
            rR = pt(u1 + 1, vm, zR),
            eL = pt(u0 - 1, v1 + 1, zE - 1),
            eR = pt(u1 + 1, v1 + 1, zE - 1),
            bL = pt(u0 - 1, v0 - 1, zE - 1),
            bR = pt(u1 + 1, v0 - 1, zE - 1);
          fillPoly(g, [bL, bR, rR, rL], CH.roofEave); // far slope, in shade
          fillPoly(g, [rL, rR, eR, eL], CH.roof); // near slope
          for (let u = u0 + 3; u < u1; u += 5) {
            // standing seams, ridge to eave
            const a = pt(u, vm, zR),
              b = pt(u, v1 + 1, zE - 1);
            fillPoly(g, [a, [a[0] + 1, a[1]], [b[0] + 1, b[1]], b], CH.roofSeam);
          }
          fillPoly(
            g,
            [eL, eR, [eR[0], eR[1] + 2], [eL[0], eL[1] + 2]],
            CH.roofEave,
          ); // fascia
          fillPoly(
            g,
            [rL, rR, [rR[0], rR[1] + 1], [rL[0], rL[1] + 1]],
            CH.roofRidge,
          ); // ridge cap
        }

        // ---- entry porch: low link between the two volumes, on the path -----
        {
          const u0 = 14,
            u1 = 28,
            v0 = 16,
            v1 = 23,
            h = 11;
          faceSW(u0, u1, v1, 0, h, CH.wallT);
          faceSE(v0, v1, u1, 0, h, CH.wallD);
          faceSW(18, 24, v1, 0, 8, CH.door); // doors, on the path's centre line
          faceSW(u0, u1, v1, h, h + 2, CH.cap);
          faceSE(v0, v1, u1, h, h + 2, CH.cap);
          top(u0, v0, u1, v1, h + 2, CH.cap);
          top(u0 + 1, v0 + 1, u1 - 1, v1 - 1, h + 2, CH.deck);
          // step down to the path
          top(18, 23, 24, 25, 2, CH.kerb);
          faceSW(18, 24, 25, 0, 2, CH.kerbDk);
        }

        // ---- shrubs: two flanking the path, two on the open lawn ------------
        for (const [u, v, r] of [
          [15, 27, 4],
          [27, 27, 4],
          [7, 25, 5],
          [39, 25, 5],
        ]) {
          const [x, y] = pt(u, v, 0);
          E(g, CH.leafDk, x, y - 3, r, r - 1);
          E(g, CH.leaf, x - 1, y - 5, r - 1, r - 2);
        }
      });
      ANCHORX["church"] = CHURCH_AX;

      // --- street furniture (upright sprites, shadow-anchored, 2-phase) ---
      // planter: square box, foliage mound; canopy sways like the trees
      def("planter", 16, 16, (g, ph) => {
        const w = ph;
        E(g, COL.sh, 8, 15, 6, 1);
        isoBox(g, 8, 8, 3, 3, 3, "#C6C0AE", "#9EA6AD", "#7C848C"); // stone box
        E(g, COL.leafDk, 8 + w, 6, 5, 3);
        E(g, COL.leafA, 8 + w, 5, 5, 3);
        E(g, COL.leafB, 9 + w, 4, 3, 2);
        E(g, COL.leafHi, 6 + w, 4, 2, 1);
      });
      // bench: iso slats, backrest, legs
      [
        ["benchA", 1],
        ["benchB", 0],
      ].forEach(([nm, alongA]) =>
        def(nm, 24, 14, (g) => {
          E(g, COL.sh, 12, 13, 7, 1);
          const seat = "#8A6238",
            slat = "#6E4A2E";
          if (alongA) {
            isoBox(g, 8, 6, 6, 2, 2, seat, slat, shade(seat, 0.7));
            P(g, slat, 6, 2, 12, 2);
          } // backrest
          else {
            isoBox(g, 16, 6, 2, 6, 2, seat, shade(seat, 0.7), slat);
            P(g, slat, 16, 2, 4, 8);
          }
        }),
      );
      // fountain: 2x2-tile basin, animated jet + ripples
      def("fountain", 68, 46, (g, ph) => {
        E(g, COL.sh, 34, 44, 22, 2);
        isoBox(g, 34, 8, 16, 16, 5, "#B8B2A6", "#9EA6AD", "#7C848C");
        rhomb(g, 34, 12, 12, 12, COL.water);
        for (let k = 0; k < 8; k++) {
          const i = 2 + ((k * 5) % 10),
            j = 2 + ((k * 3) % 10);
          P(
            g,
            ph ? COL.waterHL : COL.waterL,
            34 + 2 * (i - j),
            12 + i + j,
            3,
            1,
          );
        }
        isoBox(g, 34, 20, 3, 3, 5, "#C6C0AE", "#9EA6AD", "#7C848C");
        P(g, COL.foam, 33, 15 - ph, 2, 6);
        P(g, COL.waterHL, 31, 19, 6, 1);
      });
      // trash can
      def("bin", 10, 14, (g) => {
        E(g, COL.sh, 5, 13, 3, 1);
        isoBox(g, 5, 6, 2, 2, 5, "#3B6E5A", "#2E5647", "#24463A");
        P(g, "#24463A", 4, 5, 4, 1);
      });
      // iso-box deco factory: multi-tile pieces share the building anchor convention
      function isoDeco(nm, tx, ty, h, cT, cL, cR, decorate) {
        const a = 8 * tx,
          b = 8 * ty,
          x0 = 2 * b,
          w = 2 * (a + b) + 2,
          y0 = 8;
        ANCHORX[nm] = 2 * a + 1;
        def(nm, w, y0 + a + b + h + 2, (g, ph) => {
          E(g, COL.sh, 2 * a, y0 + a + b + h, Math.min(a, b) + 6, 2);
          isoBox(g, x0, y0, a, b, h, cT, cL, cR);
          if (decorate) decorate(g, ph, x0, y0, a, b, h);
        });
      }
      // long planters, foliage mounds riding the box
      [
        ["pltA", 2, 1],
        ["pltB", 1, 2],
      ].forEach(([nm, tx, ty]) =>
        isoDeco(
          nm,
          tx,
          ty,
          4,
          "#C6C0AE",
          "#9EA6AD",
          "#7C848C",
          (g, ph, x0, y0, a, b) => {
            const n = Math.max(a, b) / 4;
            for (let k = 0; k < n; k++) {
              const ci = a > b ? 2 + k * 4 : a >> 1,
                cj = a > b ? b >> 1 : 2 + k * 4;
              const cx = x0 + 2 * ci - 2 * cj + 1,
                cy = y0 + ci + cj;
              E(g, COL.leafDk, cx + ph, cy - 2, 4, 2);
              E(g, COL.leafA, cx + ph, cy - 3, 4, 2);
              E(g, COL.leafHi, cx - 2 + ph, cy - 4, 1, 1);
              if (k % 2) E(g, COL.leafB, cx + 1 + ph, cy - 4, 2, 2);
            }
          },
        ),
      );
      // skate ledges: low concrete slabs with pale coping + grind scuffs
      [
        ["ldgA", 3, 1],
        ["ldgB", 1, 3],
      ].forEach(([nm, tx, ty]) =>
        isoDeco(
          nm,
          tx,
          ty,
          3,
          "#D6D0BE",
          "#B8B2A6",
          "#9EA6AD",
          (g, ph, x0, y0, a, b) => {
            g.fillStyle = "#F0EAD6"; // coping edge
            if (a > b)
              for (let i = 0; i < a; i++) g.fillRect(x0 + 2 * i, y0 + i, 2, 1);
            else
              for (let j = 0; j < b; j++) g.fillRect(x0 - 2 * j, y0 + j, 2, 1);
            g.fillStyle = "#7C848C"; // scuffs
            for (let k = 3; k < Math.max(a, b); k += 5)
              g.fillRect(a > b ? x0 + 2 * k : x0 - 2 * k, y0 + k, 2, 1);
          },
        ),
      );
      // planter with a bonsai tree in it
      def("planterT", 18, 28, (g, ph) => {
        E(g, COL.sh, 9, 26, 6, 1);
        isoBox(g, 9, 18, 3, 3, 4, "#C6C0AE", "#9EA6AD", "#7C848C");
        P(g, COL.out, 8, 14, 3, 5);
        P(g, COL.trunk, 9, 14, 1, 4);
        E(g, COL.out, 9 + ph, 9, 7, 6);
        E(g, COL.leafA, 9 + ph, 8, 6, 5);
        E(g, COL.leafB, 9 + ph, 11, 5, 3);
        E(g, COL.leafHi, 6 + ph, 6, 3, 2);
      });
      // newspaper boxes
      [
        ["newsR", "COLVERM"],
        ["newsB", "COLCERL"],
      ].forEach(([nm, ck]) => {
        const col = ck === "COLVERM" ? COL.verm : COL.cerl;
        def(nm, 10, 13, (g) => {
          E(g, COL.sh, 5, 12, 3, 1);
          isoBox(g, 5, 4, 2, 2, 5, shade(col, 1.05), col, shade(col, 0.7));
          P(g, COL.win, 4, 7, 3, 2);
          P(g, COL.out, 4, 11, 1, 2);
          P(g, COL.out, 8, 11, 1, 2);
        });
      });
      // abstract public art: offset stacked cubes on a plinth
      def("sculpt", 20, 26, (g, ph) => {
        E(g, COL.sh, 10, 24, 7, 2);
        isoBox(g, 10, 16, 4, 4, 2, "#D6D0BE", "#B8B2A6", "#9EA6AD"); // plinth
        isoBox(
          g,
          9,
          10,
          3,
          2,
          5,
          COL.verm,
          shade(COL.verm, 0.72),
          shade(COL.verm, 0.55),
        );
        isoBox(
          g,
          12,
          6 - ph,
          2,
          2,
          3,
          COL.saff,
          shade(COL.saff, 0.75),
          shade(COL.saff, 0.6),
        );
        P(g, COL.foam, 13, 7 - ph, 1, 1);
      });
      def("lamp", 12, 22, (g, ph) => {
        E(g, COL.sh, 6, 20, 3, 1);
        P(g, COL.road, 5, 6, 2, 14);
        P(g, COL.road, 3, 2, 6, 5);
        P(g, COL.saff, 4, 3, 4, 3);
        P(g, COL.foam, 5 + ph, 3, 1, 1);
        if (ph) E(g, "rgba(255,204,15,0.3)", 6, 4, 5, 4);
      });

      // =================================================================
      // MAP
      // =================================================================
      // The city core is a GRID x GRID array of vacant blocks — 9 (3x3) by
      // default, scalable up to 100 (10x10). Everything downstream (map size,
      // roads, crosswalks, PLOTS, camera fit) derives from GRID, and the map is
      // sized so GRID=3 reproduces the original 96x72 layout tile-for-tile.
      const ROADW = 2,
        BLKW = 6,
        PITCH = ROADW + BLKW;
      const MIN_GRID = 3,
        MAX_GRID = 10; // 9 .. 100 buildings
      const gridForCount = (n) =>
        Math.max(MIN_GRID, Math.min(MAX_GRID, Math.ceil(Math.sqrt(Math.max(1, n | 0)))));
      let GRID = MIN_GRID,
        CITY,
        MW,
        MH,
        CX0,
        CY0;
      let ground,
        elev,
        skirt,
        PLOTS,
        occupied;
      const objs = [];
      const setG = (x, y, t) => {
        if (x >= 0 && x < MW && y >= 0 && y < MH) ground[y][x] = t;
      };
      const rcol = (k) => CX0 + k * PITCH,
        rrow = (k) => CY0 + k * PITCH;
      // Ambient traffic rides one lane of each road pair; freeLane picks the lane
      // the circuits don't use, so no car ever drives through a crane.
      const freeLane = (k) => (k === 0 || k === 2 ? 0 : 1);
      function lotGear({ i, px, py }) {
        const east = rcol(i + 1) + freeLane(i + 1), // curb lane, screen right
          west = rcol(i) + freeLane(i); // curb lane, screen left
        return {
          crane: [east, py + 1],
          scaff: [west, py + 2],
          mats: [west, py + 3],
          barriers: [
            [px + 1, py + 4], // hoarding along the two street-facing walks
            [px + 3, py + 4],
            [px + 4, py + 4],
            [px + 4, py + 2],
          ],
        };
      }

      // buildCity (re)generates the whole map for a GRID x GRID core. It reseeds
      // the PRNG so every build is deterministic, and is re-run whenever the
      // project count needs a bigger (or smaller) grid — the city literally grows
      // blocks, up to 100. GRID=3 reproduces the original 96x72 map tile-for-tile.
      function buildCity(gridN) {
        GRID = gridN;
        CITY = GRID * PITCH + ROADW;
        MW = CITY + 70;
        MH = CITY + 46;
        CX0 = Math.floor((MW - CITY) / 2);
        CY0 = Math.floor((MH - CITY) / 2);
        rand = mulberry32(20260702);
        ground = Array.from({ length: MH }, () => new Array(MW).fill("g0"));
        elev = Array.from({ length: MH }, () => new Array(MW).fill(0));
        skirt = Array.from({ length: MH }, () => new Array(MW).fill("rock"));
        objs.length = 0;
        PLOTS = [];

      for (let y = 0; y < MH; y++)
        for (let x = 0; x < MW; x++) ground[y][x] = "g" + (hash(x, y) % 3);

      // ---- city ----

      for (let y = CY0; y < CY0 + CITY; y++)
        for (let x = CX0; x < CX0 + CITY; x++)
          if ((x - CX0) % PITCH < ROADW || (y - CY0) % PITCH < ROADW)
            setG(x, y, "rd");

      for (let i = 0; i < GRID; i++)
        for (let j = 0; j < GRID; j++) {
          const bx = rcol(i) + ROADW,
            by = rrow(j) + ROADW;
          for (let y = by; y < by + BLKW; y++)
            for (let x = bx; x < bx + BLKW; x++)
              setG(x, y, "sw" + (hash(x, y) % 3));
          for (let y = by + 1; y < by + BLKW - 1; y++)
            for (let x = bx + 1; x < bx + BLKW - 1; x++) setG(x, y, "pd");
        }
      for (let ki = 0; ki <= GRID; ki++)
        for (let kj = 0; kj <= GRID; kj++) {
          const xs = rcol(ki),
            ys = rrow(kj);
          if (kj > 0) {
            setG(xs, ys - 1, "cwV");
            setG(xs + 1, ys - 1, "cwV");
          }
          if (kj < GRID) {
            setG(xs, ys + 2, "cwV");
            setG(xs + 1, ys + 2, "cwV");
          }
          if (ki > 0) {
            setG(xs - 1, ys, "cwH");
            setG(xs - 1, ys + 1, "cwH");
          }
          if (ki < GRID) {
            setG(xs + 2, ys, "cwH");
            setG(xs + 2, ys + 1, "cwH");
          }
        }
      // parked cars removed — ambient circuit traffic only. rand() draws preserved
      // verbatim: this loop's consumption pattern positions everything downstream.
      const BUSY_V = new Set(["0,0", "1,0", "1,1", "2,0", "2,1", "3,1"]),
        BUSY_H = new Set(["0,0", "1,0", "1,1", "2,0", "2,1", "3,1"]);
      for (let k = 0; k <= 3; k++)
        for (let b = 0; b < 3; b++)
          for (let p = 1; p < BLKW - 2; p += 2) {
            if (rand() < 0.4 && !BUSY_V.has(k + ",0")) rand();
            if (rand() < 0.4 && !BUSY_V.has(k + ",1")) rand();
            if (rand() < 0.4 && !BUSY_H.has(k + ",0")) rand();
            if (rand() < 0.4 && !BUSY_H.has(k + ",1")) rand();
          }

      // ---- arterials: winding roads east and west (carved before flora) ----
      function roadRect(x0, y0, x1, y1) {
        for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
          for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
            setG(x, y, "rd");
      }
      const RE = rrow(1),
        RW = rrow(2),
        CE = CX0 + CITY;
      roadRect(CE, RE, CE + 5, RE + 1); // east: out of the city
      roadRect(CE + 4, RE - 3, CE + 5, RE + 1); // jog north
      roadRect(CE + 4, RE - 3, CE + 12, RE - 2);
      roadRect(CE + 11, RE - 2, CE + 12, RE + 2); // jog south
      roadRect(CE + 11, RE + 2, CE + 19, RE + 3); // into the forest clearing
      roadRect(CX0 - 6, RW, CX0 - 1, RW + 1); // west: out of the city
      roadRect(CX0 - 6, RW, CX0 - 5, RW + 4); // jog south
      roadRect(CX0 - 14, RW + 3, CX0 - 5, RW + 4);
      roadRect(CX0 - 14, RW - 1, CX0 - 13, RW + 4); // jog north
      roadRect(CX0 - 22, RW - 1, CX0 - 13, RW); // into the meadow

      // ---- north: mountain pulled close, bouldery (per-column ridge + jitter) ----
      const nb = [],
        RH = [];
      let jw = 0,
        jr = 0;
      for (let x = 0; x < MW; x++) {
        nb[x] = Math.max(15, Math.min(18, 17 + Math.round(jw)));
        jw = Math.max(-2, Math.min(2, jw + (rand() * 2 - 1) * 1.6));
        RH[x] = Math.max(5, Math.min(9, 7 + Math.round(jr)));
        jr = Math.max(-2.5, Math.min(2.5, jr + (rand() * 2 - 1) * 1.5));
      }
      const WX = Math.floor(MW / 2);
      for (let x = WX - 2; x <= WX + 2; x++) nb[x] = 17; // stable shelf under the falls
      for (let x = 50; x <= 68; x++) nb[x] = Math.max(nb[x], 17); // trail flank
      // St Aidan's stands clear of the rock: the ridge foot is pulled back off
      // the church lot, so the tabernacle's east end lands on open grass
      for (let x = 35; x <= 49; x++) {
        const t = Math.min(x - 34, 50 - x);
        nb[x] = Math.min(nb[x], 14 + Math.max(0, 3 - t));
      }
      for (let x = 0; x < MW; x++)
        for (let y = 0; y <= nb[x]; y++) {
          const d = nb[x] - y;
          const fall = x >= WX - 1 && x <= WX + 1;
          const j = fall
            ? 0
            : hash(x, y) % 5 === 0
              ? 1
              : hash(y, x) % 7 === 0
                ? -1
                : 0;
          const e = Math.max(1, Math.min(fall ? 9 : RH[x], 1 + d + j));
          elev[y][x] = e;
          setG(
            x,
            y,
            e >= 7
              ? hash(x, y) % 3
                ? "sn"
                : "rk"
              : hash(x, y) % 4
                ? "rk"
                : "rkD",
          );
        }
      for (let x = WX - 1; x <= WX + 1; x++)
        for (let y = 2; y <= nb[x]; y++) {
          setG(x, y, "w0");
          skirt[y][x] = "fall";
        }
      const poolY = Math.max(nb[WX - 1], nb[WX], nb[WX + 1]) + 1;
      for (let y = poolY; y < poolY + 3; y++)
        for (let x = WX - 3; x <= WX + 3; x++)
          setG(
            x,
            y,
            y === poolY && x >= WX - 1 && x <= WX + 1
              ? "wfF"
              : "w" + (hash(x, y) % 2),
          );
      const EXC = rcol(2);
      [
        [EXC, CY0 - 1],
        [EXC + 1, CY0 - 1],
        [EXC, CY0 - 2],
        [EXC + 1, CY0 - 2],
        [EXC + 1, CY0 - 3],
        [EXC + 2, CY0 - 3],
        [EXC + 2, CY0 - 4],
        [EXC + 3, CY0 - 4],
        [EXC + 2, poolY + 2],
        [EXC + 1, poolY + 2],
        [EXC + 1, poolY + 1],
        [EXC + 2, poolY + 1],
      ].forEach((p) => setG(p[0], p[1], "rd"));
      // winding trail up the east face to a summit pad
      let te = 1,
        tc = 0;
      function trailTile(x, y) {
        setG(x, y, "tr");
        elev[y][x] = Math.min(9, te);
        if (++tc % 3 === 0) te++;
      }
      trailTile(66, 18);
      trailTile(66, 17);
      for (let x = 65; x >= 53; x--) trailTile(x, 17);
      trailTile(53, 16);
      trailTile(53, 15);
      for (let x = 54; x <= 64; x++) trailTile(x, 15);
      trailTile(64, 14);
      trailTile(64, 13);
      for (let x = 63; x >= 54; x--) trailTile(x, 13);
      for (let yy = 11; yy <= 12; yy++)
        for (let xx = 52; xx <= 54; xx++) {
          // summit pad
          setG(xx, yy, "tr");
          elev[yy][xx] = Math.min(9, te);
        }
      // boulders strewn on the slope
      for (let r = 0; r < 14; r++) {
        const x = 3 + Math.floor(rand() * (MW - 6)),
          y = 1 + Math.floor(rand() * 15);
        const g0 = ground[y][x];
        if (g0 === "rk" || g0 === "rkD") objs.push({ s: "boulder", x, y });
      }
      // boulders at the mountain foot
      for (let b = 0; b < 6; b++) {
        const x = 4 + Math.floor(rand() * (MW - 8)),
          y = nb[Math.min(MW - 1, x)] + 1 + Math.floor(rand() * 2);
        if (
          Math.abs(x - WX) > 5 &&
          Math.abs(x - EXC - 1) > 3 &&
          ground[y][x].startsWith("g")
        )
          objs.push({ s: "boulder", x, y });
      }

      // ---- south: coastline, palms, sea rocks ----
      const sandStart = CY0 + CITY + 3;
      let js = 0;
      const sandEndAt = [];
      for (let x = 0; x < MW; x++) {
        // Coastline sits a fixed margin off the map's south edge; MH-15 is 57 at
        // GRID=3 (unchanged) and moves south with a larger map so the sea never
        // creeps up over the enlarged core.
        const sandEnd = MH - 15 + Math.round(js);
        sandEndAt[x] = sandEnd;
        js = Math.max(-2.5, Math.min(2.5, js + (rand() * 2 - 1) * 1.2));
        for (let y = sandStart; y <= sandEnd && y < MH; y++) setG(x, y, "sd");
        if (sandEnd + 1 < MH) setG(x, sandEnd + 1, "surf");
        for (let y = sandEnd + 2; y < MH; y++)
          setG(x, y, "w" + (hash(x, y) % 2));
      }
      // beachfront promenade along the grass/sand perimeter, full width
      for (let x = 2; x < MW - 2; x++) {
        setG(x, sandStart - 1, "bw");
        setG(x, sandStart, "bw");
      }
      // path down from the city, meeting the promenade
      const BX = rcol(1);
      for (let y = CY0 + CITY; y < sandStart - 1; y++) {
        setG(BX, y, "sw" + (hash(BX, y) % 3));
        setG(BX + 1, y, "sw" + (hash(BX + 1, y) % 3));
      }
      // pier continuing out over the surf
      const bwEnd = Math.max(sandEndAt[BX], sandEndAt[BX + 1]) + 3;
      for (let y = sandStart + 1; y <= bwEnd; y++) {
        setG(BX, y, "bw");
        setG(BX + 1, y, "bw");
      }
      for (
        let y = bwEnd + 1;
        y <= bwEnd + 2 && y < MH;
        y++ // end deck
      )
        for (let x = BX - 1; x <= BX + 2; x++) setG(x, y, "bw");

      for (let x = 4; x < MW - 4; x += 7 + Math.floor(rand() * 4)) {
        if (Math.abs(x - BX) < 4) continue; // clear of the boardwalk
        objs.push({ s: "palm", x, y: sandStart + 1 + Math.floor(rand() * 3) });
      }
      // rocks land where the sea/sand does, never on the planking: the pier and
      // promenade are the only "bw" tiles out here, so the grid is the test.
      const onDeck = (x, y) => (ground[y] || [])[x] === "bw";
      for (let r = 0; r < 10; r++) {
        const x = 3 + Math.floor(rand() * (MW - 6));
        const y = sandEndAt[x] + 3 + Math.floor(rand() * 5);
        if (onDeck(x, y)) continue;
        objs.push({ s: "rockW", x, y });
      }
      for (let r = 0; r < 3; r++) {
        const x = 6 + Math.floor(rand() * (MW - 12));
        const y = sandStart + 1 + Math.floor(rand() * 2);
        if (onDeck(x, y)) continue;
        objs.push({ s: "boulder", x, y });
      }

      // ---- low-rise district: 4-tile terracotta band around the core ----
      const BAND = 4;
      for (
        let y = CY0 - BAND;
        y <= CY0 + CITY + 1;
        y++ // south capped at 2 rows (beach)
      )
        for (let x = CX0 - BAND; x <= CX0 + CITY + BAND - 1; x++) {
          if (x >= CX0 && x < CX0 + CITY && y >= CY0 && y < CY0 + CITY)
            continue;
          const g0 = (ground[y] || [])[x];
          if (!g0 || !(g0.startsWith("g") || g0 === "tg" || g0[0] === "f"))
            continue;
          setG(x, y, "sw" + (hash(x, y) % 3));
        }
      const NSV = [0, 1, 2, 4, 5, 6, 7],
        EWV = [0, 1, 2, 3, 5, 6, 8]; // ty==2 / tx==2
      function placeRun(horizontal, fixed, from, to) {
        const list = horizontal ? NSV : EWV;
        let pos = from,
          last = -1;
        while (pos <= to) {
          if (rand() < 0.18) {
            pos += 2;
            continue;
          } // vacant lot
          let vi = list[Math.floor(rand() * list.length)];
          if (vi === last) vi = list[(list.indexOf(vi) + 1) % list.length];
          const v = BVARIANTS[vi];
          const ax = horizontal ? pos : fixed,
            ay = horizontal ? fixed : pos;
          const span = horizontal ? v.tx : v.ty;
          let ok = !(
            horizontal &&
            fixed === CY0 + CITY &&
            ax <= BX + 1 &&
            ax + v.tx - 1 >= BX
          );
          for (let dy = 0; dy < v.ty && ok; dy++)
            for (let dx = 0; dx < v.tx && ok; dx++) {
              const g0 = (ground[ay + dy] || [])[ax + dx];
              if (!g0 || !g0.startsWith("sw")) ok = false;
            }
          if (!ok) {
            pos += 1;
            continue;
          }
          for (let dy = 0; dy < v.ty; dy++)
            for (let dx = 0; dx < v.tx; dx++)
              if (v.gr) setG(ax + dx, ay + dy, v.gr); // building's own ground
          objs.push({
            s: "bldg" + vi,
            x: ax + v.tx - 1,
            y: ay + v.ty - 1,
            dy: 8,
          });
          last = vi;
          pos += span + 1 + (rand() < 0.45 ? 1 : 0);
        }
      }
      placeRun(true, CY0 - 3, CX0 - 3, CX0 + CITY + 1); // north
      placeRun(true, CY0 + CITY, CX0 - 3, CX0 + CITY + 1); // south
      placeRun(false, CX0 - 3, CY0, CY0 + CITY - 3); // west
      placeRun(false, CX0 + CITY + 1, CY0, CY0 + CITY - 3); // east
      // exactly one 41 Cooper, replacing the first florist on the west run (marked slot)
      {
        const t = objs
          .filter((o) => o.s === "bldg8" && o.x === CX0 - 2)
          .sort((p, q) => p.y - q.y)[0];
        if (t) t.s = "bldg9";
      }
      for (let x = CX0 - 4; x <= CX0 + CITY + 3; x += 5) {
        // lamps on the outer walks
        if (((ground[CY0 - 4] || [])[x] || "").startsWith("sw"))
          objs.push({ s: "lamp", x, y: CY0 - 4 });
      }
      for (let y = CY0 - 2; y <= CY0 + CITY; y += 5) {
        if (((ground[y] || [])[CX0 - 4] || "").startsWith("sw"))
          objs.push({ s: "lamp", x: CX0 - 4, y });
        if (((ground[y] || [])[CX0 + CITY + 3] || "").startsWith("sw"))
          objs.push({ s: "lamp", x: CX0 + CITY + 3, y });
      }

      // --- St Aidan's on the mountain side: the lot sits at the foot of the
      // north ridge, so the campus looks SW across the city to the water ---
      const CHX = 42,
        CHY = 22,
        CHTX = 6,
        CHTY = 5;
      const churchTiles = [];
      for (let dy = 0; dy < CHTY; dy++)
        for (let dx = 0; dx < CHTX; dx++)
          churchTiles.push(CHX - dx + "," + (CHY - dy));
      {
        const foot = new Set(churchTiles);
        for (let i = objs.length - 1; i >= 0; i--)
          if (foot.has(objs[i].x + "," + objs[i].y)) objs.splice(i, 1);
        objs.push({ s: "church", x: CHX, y: CHY, dy: 9 });
      }

      // ---- lots: the GRID x GRID paved core blocks are the vacant land ----
      // Each block is 6x6: a 1-tile sidewalk ring around a 4x4 paved pad. The
      // tower owns the pad outright and stands dead-centre on it, so the site
      // works the street instead — gear goes on the ring and the curb lane.
      for (let j = 0; j < GRID; j++)
        for (let i = 0; i < GRID; i++)
          PLOTS.push({ i, j, px: rcol(i) + ROADW + 1, py: rrow(j) + ROADW + 1 }); // 4x4 pad

      // Ambient traffic only ever rides one lane of each road pair (see CIRCUITS:
      // the circuit rectangles land on rcol(k)+1 for k=0,2 and rcol(k)+0 for k=1,3).
      // freeLane picks the other one, so no car ever drives through a crane.
      // Screen-x offset from the tower's centre line, in half-tiles: a piece is
      // clear of the 3-tile-wide tower body once |dx| > 3. Crane and scaffold sit
      // at 4-6, so their masts rise beside the tower, never across it. The
      // barriers are short enough to stay under its base edge out front.

      // --- street furniture on open plaza tiles (terracotta with nothing on it) ---
      occupied = new Set(objs.map((o) => o.x + "," + o.y));
      // hold the hoarding line clear so no bench or lamp spawns under a barrier
      PLOTS.forEach((lot) =>
        lotGear(lot).barriers.forEach(([x, y]) => occupied.add(x + "," + y)),
      );
      churchTiles.forEach((t) => occupied.add(t));
      function furnitureFits(x, y, w, h) {
        for (let dy = 0; dy < h; dy++)
          for (let dx = 0; dx < w; dx++) {
            const g0 = (ground[y + dy] || [])[x + dx];
            if (!g0 || !g0.startsWith("sw")) return false;
            if (occupied.has(x + dx + "," + (y + dy))) return false;
          }
        return true;
      }
      function claim(x, y, w, h, s, dy) {
        for (let j = 0; j < h; j++)
          for (let i = 0; i < w; i++) occupied.add(x + i + "," + (y + j));
        objs.push({ s, x: x + w - 1, y: y + h - 1, dy: dy || 6 });
      }
      // fountains: a couple of 2x2 plaza centerpieces in corner plazas
      [
        [CX0 - 3, CY0 - 3],
        [CX0 + CITY + 1, CY0 + CITY - 1],
      ].forEach(([fx, fy]) => {
        for (let oy = 0; oy <= 1; oy++)
          for (let ox = 0; ox <= 1; ox++)
            if (furnitureFits(fx + ox, fy + oy, 2, 2)) {
              claim(fx + ox, fy + oy, 2, 2, "fountain", 8);
              return;
            }
      });
      // city-interior block walks stay BLANK; all furniture lives on the band
      const inCore = (x, y) =>
        x >= CX0 && x < CX0 + CITY && y >= CY0 && y < CY0 + CITY;
      // pass 1: multi-tile pieces (ledge runs, long planters), oriented to their side
      for (let y = CY0 - BAND; y <= CY0 + CITY + 1; y++)
        for (let x = CX0 - BAND; x <= CX0 + CITY + BAND - 1; x++) {
          if (inCore(x, y)) continue;
          const ns = y < CY0 || y >= CY0 + CITY; // north/south band -> run along x
          const h2 = hash(x * 7 + 3, y * 11 + 1) % 100;
          if (h2 < 5) {
            const [w, h] = ns ? [3, 1] : [1, 3];
            if (furnitureFits(x, y, w, h))
              claim(x, y, w, h, ns ? "ldgA" : "ldgB", 8);
          } else if (h2 < 11) {
            const [w, h] = ns ? [2, 1] : [1, 2];
            if (furnitureFits(x, y, w, h))
              claim(x, y, w, h, ns ? "pltA" : "pltB", 8);
          } else if (h2 < 15) {
            if (furnitureFits(x, y, 1, 1)) claim(x, y, 1, 1, "planterT");
          } else if (h2 < 17) {
            if (furnitureFits(x, y, 1, 1)) claim(x, y, 1, 1, "sculpt");
          }
        }
      // pass 2: small fill between the installations
      for (let y = CY0 - BAND; y <= CY0 + CITY + 1; y++)
        for (let x = CX0 - BAND; x <= CX0 + CITY + BAND - 1; x++) {
          if (inCore(x, y) || !furnitureFits(x, y, 1, 1)) continue;
          const h = hash(x * 3 + 1, y * 5 + 2) % 100;
          if (h < 9) claim(x, y, 1, 1, "planter");
          else if (h < 16) claim(x, y, 1, 1, (x + y) & 1 ? "benchA" : "benchB");
          else if (h < 20) claim(x, y, 1, 1, "bin");
        }
      // pass 3: core block walks — light sprinkle only, keep the middle daylighted
      for (let y = CY0; y < CY0 + CITY; y++)
        for (let x = CX0; x < CX0 + CITY; x++) {
          if (!ground[y][x].startsWith("sw") || !furnitureFits(x, y, 1, 1))
            continue;
          const h = hash(x * 13 + 7, y * 17 + 3) % 100;
          if (h < 3) claim(x, y, 1, 1, (x + y) & 1 ? "benchA" : "benchB");
          else if (h < 5) claim(x, y, 1, 1, "bin");
          else if (h < 7) claim(x, y, 1, 1, (x ^ y) & 1 ? "newsR" : "newsB");
          else if (h < 10) claim(x, y, 1, 1, "lamp");
        }
      // planters on the outer ring of each center block (the road-facing row)
      for (let bi = 0; bi < 3; bi++)
        for (let bj = 0; bj < 3; bj++) {
          const bx = rcol(bi) + ROADW,
            by = rrow(bj) + ROADW;
          for (let k = 0; k < BLKW; k++) {
            [
              [bx + k, by],
              [bx + k, by + BLKW - 1],
              [bx, by + k],
              [bx + BLKW - 1, by + k],
            ].forEach(([px, py]) => {
              if (
                hash(px * 19 + 11, py * 23 + 5) % 100 < 12 &&
                furnitureFits(px, py, 1, 1)
              )
                claim(px, py, 1, 1, "planter");
            });
          }
        }

      // ---- terraces: raised earth ledges ----
      function plateau(x0, y0, w, h) {
        for (let y = y0; y < y0 + h; y++)
          for (let x = x0; x < x0 + w; x++)
            if (x >= 0 && x < MW && y >= 0 && y < MH) {
              elev[y][x] = 1;
              skirt[y][x] = "earth";
            }
      }
      plateau(8, 22, 10, 5); // west
      plateau(16, 40, 9, 5); // west
      plateau(CX0 + CITY + 7, 20, 13, 5); // forest shelf, east

      // ---- east: forest wall (near-solid, overlapping canopies) ----
      const nearRoad = (x, y) => {
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            const g = (ground[y + dy] || [])[x + dx];
            if (g === "rd") return true;
          }
        return false;
      };
      for (let y = 19; y < sandStart - 2; y += 2)
        for (let x = CX0 + CITY + 5; x < MW - 1; x++)
          if (rand() < 0.8 && !nearRoad(x, y)) objs.push({ s: "tree", x, y });

      // ---- west: overgrown meadow ----
      const meadowOK = (x, y) =>
        x >= 2 && x < CX0 - 2 && y >= 19 && y < sandStart - 1;
      for (let p = 0; p < 14; p++) {
        // sprawling tall-grass patches
        const px = 2 + Math.floor(rand() * (CX0 - 10)),
          py = 19 + Math.floor(rand() * (sandStart - 25));
        const pw = 5 + Math.floor(rand() * 6),
          ph = 4 + Math.floor(rand() * 4);
        for (let y = py; y < py + ph; y++)
          for (let x = px; x < px + pw; x++)
            if (meadowOK(x, y) && ground[y][x].startsWith("g"))
              setG(x, y, "tg");
      }
      [
        [4, 31, 11, 5],
        [21, 34, 8, 4],
        [6, 45, 9, 4],
      ].forEach(([fx, fy, fw, fh]) => {
        for (let y = fy; y < fy + fh; y++)
          for (let x = fx; x < fx + fw; x++)
            if (
              meadowOK(x, y) &&
              (ground[y][x].startsWith("g") || ground[y][x] === "tg")
            )
              setG(x, y, "ff" + (hash(x, y) % 2));
      });
      for (
        let y = 19;
        y < sandStart - 1;
        y++ // overgrowth fill on remaining grass
      )
        for (let x = 2; x < CX0 - 2; x++) {
          if (!ground[y][x].startsWith("g")) continue;
          const h = hash(x, y) % 10;
          if (h < 3) setG(x, y, "tg");
          else if (h < 5) setG(x, y, ["fR", "fY", "fW"][h - 3]);
        }
      for (let b = 0; b < 40; b++) {
        // bulb plants everywhere
        const x = 3 + Math.floor(rand() * (CX0 - 8)),
          y = 20 + Math.floor(rand() * (sandStart - 26));
        const g = ground[y][x];
        if (g.startsWith("g") || g === "tg")
          objs.push({ s: ["bR", "bY", "bW"][Math.floor(rand() * 3)], x, y });
      }
      for (let t = 0; t < 12; t++) {
        // tree clusters
        const x = 4 + Math.floor(rand() * (CX0 - 12)),
          y = 20 + Math.floor(rand() * (sandStart - 28));
        if (ground[y][x] === "rd") continue;
        objs.push({ s: "tree", x, y });
        if (rand() < 0.6 && ground[y + 1][x + 1] !== "rd")
          objs.push({ s: "tree", x: x + 1, y: y + 1 });
        if (rand() < 0.5 && ground[y][x + 2] !== "rd")
          objs.push({ s: "streetTree", x: x + 2, y });
      }

      objs.sort((a, b) => a.x + a.y - (b.x + b.y) || a.y - b.y);
      }
      buildCity(gridForCount(0));

      // ambient traffic: closed rectangular circuits around blocks —
      // cars never spawn or despawn, they loop the grid
      const CIRCUITS = [
        { ka: 0, kb: 1, kc: 0, kd: 1, cw: 1 },
        { ka: 1, kb: 2, kc: 1, kd: 2 },
        { ka: 2, kb: 3, kc: 2, kd: 3, cw: 1 },
      ];
      const AMBIENT = [
        { ci: 0, off: 0.0, c: 0 },
        { ci: 0, off: 0.5, c: 2 },
        { ci: 1, off: 0.15, c: 1 },
        { ci: 1, off: 0.65, c: 3 },
        { ci: 2, off: 0.3, c: 0 },
        { ci: 2, off: 0.8, c: 2 },
      ];
      // Each circuit is a lane rectangle with its corners rounded into quarter-turn
      // arcs, so a car's heading sweeps through a corner instead of snapping 90°.
      // Rights (CW, inset lane) turn tighter than lefts (CCW, outer lane).
      const TURN_R_CW = 0.8,
        TURN_R_CCW = 1.25;
      function circuitPath(q) {
        // RH (US) lanes both directions. CCW rides the outer lane rectangle and
        // makes left turns; CW rides the inset lane rectangle and makes rights.
        const cw = q.cw;
        const x1 = rcol(q.ka) + (cw ? 1 : 0),
          x2 = rcol(q.kb) + (cw ? 0 : 1);
        const y1 = rrow(q.kc) + (cw ? 1 : 0),
          y2 = rrow(q.kd) + (cw ? 0 : 1);
        // corners in travel order
        const C = cw
          ? [
              [x1, y1],
              [x2, y1],
              [x2, y2],
              [x1, y2],
            ]
          : [
              [x2, y1],
              [x1, y1],
              [x1, y2],
              [x2, y2],
            ];
        const R = Math.min(
          cw ? TURN_R_CW : TURN_R_CCW,
          (x2 - x1) / 2,
          (y2 - y1) / 2,
        );
        const dir = (a, b) => {
          const dx = b[0] - a[0],
            dy = b[1] - a[1],
            l = Math.hypot(dx, dy);
          return [dx / l, dy / l];
        };
        const T1 = [],
          T2 = [],
          arc = [];
        for (let i = 0; i < 4; i++) {
          const V = C[i],
            P = C[(i + 3) % 4],
            N = C[(i + 1) % 4];
          const di = dir(P, V),
            dou = dir(V, N);
          T1[i] = [V[0] - di[0] * R, V[1] - di[1] * R]; // enter tangent
          T2[i] = [V[0] + dou[0] * R, V[1] + dou[1] * R]; // exit tangent
          const c = [
            V[0] - di[0] * R + dou[0] * R,
            V[1] - di[1] * R + dou[1] * R,
          ];
          const sgn = Math.sign(di[0] * dou[1] - di[1] * dou[0]);
          const a0 = Math.atan2(T1[i][1] - c[1], T1[i][0] - c[0]);
          arc[i] = {
            arc: 1,
            c,
            R,
            a0,
            sgn,
            len: (R * Math.PI) / 2,
          };
        }
        const segs = [];
        for (let i = 0; i < 4; i++) {
          segs.push(arc[i]);
          const a = T2[i],
            b = T1[(i + 1) % 4];
          segs.push({
            arc: 0,
            a,
            d: dir(a, b),
            len: Math.hypot(b[0] - a[0], b[1] - a[1]),
          });
        }
        return { segs, len: segs.reduce((s, g) => s + g.len, 0) };
      }
      const PATHS = CIRCUITS.map(circuitPath);
      // position + world heading at arclength u
      function pathAt(p, u) {
        u = ((u % p.len) + p.len) % p.len;
        for (const g of p.segs) {
          if (u >= g.len) {
            u -= g.len;
            continue;
          }
          if (!g.arc)
            return {
              x: g.a[0] + g.d[0] * u,
              y: g.a[1] + g.d[1] * u,
              th: Math.atan2(g.d[1], g.d[0]),
            };
          const a = g.a0 + (g.sgn * u) / g.R;
          return {
            x: g.c[0] + g.R * Math.cos(a),
            y: g.c[1] + g.R * Math.sin(a),
            th: Math.atan2(g.sgn * Math.cos(a), -g.sgn * Math.sin(a)),
          };
        }
        const g = p.segs[p.segs.length - 1]; // fp guard
        return { x: g.a[0], y: g.a[1], th: Math.atan2(g.d[1], g.d[0]) };
      }
      function trafficNow(tms) {
        return AMBIENT.map((car) => {
          const p = PATHS[car.ci];
          const at = pathAt(p, car.off * p.len + tms * 0.002); // 2 tiles/s
          const k =
            (((Math.round((at.th * NYAW) / (2 * Math.PI)) % NYAW) + NYAW) %
              NYAW) |
            0;
          return { s: carName(car.c, k), x: at.x, y: at.y, dy: CAR_DY };
        });
      }

      // =================================================================
      // PROJECT TOWERS: one project per vacant core block. A new project is a
      // 1-story office; every item that reaches completion 1.0 stacks another
      // story, so a long-running project grows into a skyscraper. Open items
      // keep construction equipment on the lot. Three building sets, each with
      // its own starter / lobby / generic story / modern crown.
      // =================================================================
      const PTX = 3,
        PTY = 3, // tower footprint, in tiles (fits the 4x4 block pad)
        LOBBY_H = 18,
        STORY_H = 11,
        STARTER_H = 15,
        MAX_STORIES = 48,
        TMARG = 12; // sprite side margin: crown balconies overhang the footprint

      // Nine sets, ordered oldest -> newest, so a project's id spreads the
      // skyline across eras the way a real one mixes them. Each set supplies the
      // three layers that actually differ between styles — story, lobby, crown —
      // as functions; the shell, the starter and the base outline are shared.
      // (Declarations are hoisted, so the handlers below are defined further down.)
      // 20 modern -> futuristic styles. INTERLEAVED by shape family (prism, cyl,
      // taper, setback, twist, pyramid, crystal, repeating) so that stepping
      // through the list by a fixed stride hits a different shape each time — this
      // is what makes a handful of projects look varied instead of a wall of
      // boxes. Assignment is styleFor(id) below, NOT id % length. `flat` =
      // rectangular footprint (wears a wall logo, gets the crisp base outline).
      const BSETS = [
  { key: 'AZURE', flat: true,    body: '#3B4650', accent: '#7FDCFF', trim: '#D6D0BE', glass: '#7FDCFF', windows: 'grid',    silhouette: silPrism,    crown: crownFlatDeck, crownRoom: 44 },
  { key: 'MARINE',   body: '#4E7EA6', accent: '#7FDCFF', trim: '#F0EAD6', glass: '#BFE8FF', silhouette: silCylinder, crown: crownDome,     crownRoom: 50 },

  { key: 'VERDE', flat: true,    body: '#8CA98C', accent: '#1FBF85', trim: '#F4EFE2', glass: '#B7E3C9', silhouette: silSetback,  crown: crownGarden,   crownRoom: 52 },
