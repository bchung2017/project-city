<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Project City — 1.1</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #073a3b;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #tag {
        position: fixed;
        top: 10px;
        left: 12px;
        font: 700 11px/1 monospace;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 2px 2px 0 #073a3b;
        user-select: none;
        pointer-events: none;
      }
      /* project HUD: one row per project, with the render-progress toggle */
      #pcp {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 6;
        background: #3b3f44;
        border: 3px solid #073a3b;
        box-shadow: 3px 3px 0 rgba(7, 58, 59, 0.35);
        padding: 6px;
        min-width: 232px;
        max-height: 46vh;
        overflow-y: auto;
      }
      #pcp h2 {
        margin: 2px 4px 6px;
        font: 700 10px/1 monospace;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffcc0f;
        text-shadow: 2px 2px 0 #073a3b;
      }
      .pcrow {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 4px;
        font: 700 10px/1.4 monospace;
        letter-spacing: 1px;
        color: #ffffff;
      }
      .pcrow.off .pcname,
      .pcrow.off .pcstat {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .pcempty {
        opacity: 0.6;
        letter-spacing: 2px;
      }
      .pcname {
        flex: 1;
        text-transform: uppercase;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-shadow: 2px 2px 0 #073a3b;
      }
      .pcstat {
        color: #7fdcff;
        white-space: nowrap;
      }
      .pctog {
        font: 700 9px/1 monospace;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 3px 5px;
        min-width: 32px;
        color: #073a3b;
        background: #ffcc0f;
        border: 2px solid #073a3b;
      }
      .pcrow.off .pctog {
        background: #474b50;
        color: #f0ead6;
      }
      .pctog:disabled {
        opacity: 0.5;
      }
      /* handshake: hovering a project tower wires it to a details callout.
         The whole overlay is click-through so the canvas still gets the click. */
      #pcc {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        display: none;
      }
      #pccline {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #pccard {
        position: absolute;
        width: 236px;
        background: #3b3f44;
        border: 3px solid #073a3b;
        box-shadow: 3px 3px 0 rgba(7, 58, 59, 0.35);
        padding: 8px 9px;
        font: 700 10px/1.5 monospace;
        letter-spacing: 1px;
        color: #ffffff;
      }
      #pcctitle {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffcc0f;
        text-shadow: 2px 2px 0 #073a3b;
        margin-bottom: 5px;
        overflow-wrap: anywhere;
      }
      .pccrow {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .pcck {
        opacity: 0.62;
        text-transform: uppercase;
      }
      .pccv {
        color: #7fdcff;
        white-space: nowrap;
      }
      #pccbar {
        height: 7px;
        margin: 6px 0 2px;
        border: 2px solid #073a3b;
        background: #474b50;
      }
      #pccfill {
        height: 100%;
        background: #ffcc0f;
      }
      #pccitems {
        margin: 5px 0 0;
        padding: 0;
        list-style: none;
      }
      #pccitems li {
        display: flex;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
      }
      #pccitems li span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pccitems li.done {
        color: #8fbf6b;
      }
      #pccitems li.more {
        opacity: 0.55;
        letter-spacing: 2px;
      }
      .pcx {
        flex: none;
        width: 8px;
        opacity: 0.8;
      }
      #pcchint {
        margin-top: 7px;
        padding-top: 6px;
        border-top: 2px solid #073a3b;
        color: #ffcc0f;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="tag">PROJECT CITY v3.6</div>
    <canvas id="cv"></canvas>
    <div id="pcp">
      <h2>Projects</h2>
      <div id="pclist"></div>
    </div>
    <div id="pcc">
      <svg id="pccline">
        <polyline
          id="pccpath"
          fill="none"
          stroke="#FFCC0F"
          stroke-width="3"
          stroke-linejoin="miter"
        />
        <circle
          id="pccdot"
          r="4"
          fill="#FFCC0F"
          stroke="#073A3B"
          stroke-width="2"
        />
      </svg>
      <div id="pccard">
        <div id="pcctitle"></div>
        <div id="pccstats"></div>
        <div id="pccbar"><div id="pccfill"></div></div>
        <ul id="pccitems"></ul>
        <div id="pcchint">CLICK TO OPEN &#9654;</div>
      </div>
    </div>
    <script>
      // =================================================================
      // Iso tilemap, volumetric sprite pass:
      // lobed 3-value canopies, baked drop shadows, bulb flowers,
      // shaded boulders, earth-ledge terraces, dense forest walls.
      // =================================================================
      const TW = 32,
        TH = 16,
        EH = 8;

      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      let rand = mulberry32(20260702);
      const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

      const COL = {
        grass: "#27AE7E",
        grassD: "#1E9367",
        grassL: "#33C08D",
        tall: "#148F63",
        tallD: "#0E7A55",
        tallL: "#1FBF85",
        road: "#3B3F44",
        roadL: "#474B50",
        walk: "#F0EAD6",
        walkD: "#D6D0BE",
        pad: "#D6D0BE",
        padD: "#C6C0AE",
        sand: "#FFE18F",
        sandD: "#E9C048",
        water: "#0096E6",
        waterL: "#40BCF4",
        foam: "#FFFFFF",
        waterHL: "#7FDCFF",
        rock: "#9BA3AB",
        rockD: "#7C848C",
        rockDD: "#666C73",
        cliffL: "#5F656C",
        cliffB: "#4F545A",
        rockL: "#BCC2C9",
        snow: "#FFFFFF",
        snowD: "#DCE6EF",
        leafHi: "#25CDCE",
        leafA: "#00B7B9",
        leafB: "#008C8E",
        leafDk: "#046A6C",
        out: "#073A3B",
        trunk: "#6E4A2E",
        trunkD: "#523620",
        earthL: "#8A6238",
        earthR: "#6E4A2E",
        earthD: "#523620",
        saff: "#FFCC0F",
        verm: "#F02D0E",
        cerl: "#0090DC",
        white: "#F0EAD6",
        wheel: "#1E2124",
        win: "#7FDCFF",
        sh: "rgba(7,58,59,0.35)",
      };
      // Takes "#rrggbb" but returns "rgb(r,g,b)", so a colour that has already
      // been shaded — shade(shade(x)), or a shaded colour handed to a helper
      // that shades it again — has to parse too. Unhandled, parseInt() gives
      // NaN, NaN >> 16 is 0, and the result silently paints pure black.
      function shade(col, f) {
        const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
        const m = /^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(col);
        if (m) return `rgb(${c(+m[1])},${c(+m[2])},${c(+m[3])})`;
        const n = parseInt(col.slice(1), 16);
        return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
      }

      // ---- diamond geometry ----
      const hw = (y) => (y < TH / 2 ? 2 * (y + 1) : 2 * (TH - y));
      const edgeY = (i) => Math.floor(TH - (Math.abs(i - 15.5) + 0.5) / 2);

      const mask = document.createElement("canvas");
      mask.width = TW;
      mask.height = TH;
      {
        const g = mask.getContext("2d");
        g.fillStyle = "#fff";
        for (let y = 0; y < TH; y++)
          g.fillRect(TW / 2 - hw(y), y, hw(y) * 2, 1);
      }

      // ---- factories ----
      const tiles = {};
      function P(g, c, x, y, w, h) {
        g.fillStyle = c;
        g.fillRect(x, y, w || 1, h || 1);
      }
      // pixel-rasterized ellipse: the volumetric building block
      function E(g, c, cx, cy, rx, ry) {
        g.fillStyle = c;
        for (let dy = -ry; dy <= ry; dy++) {
          const t = ry ? dy / ry : 0;
          const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - t * t)));
          g.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
        }
      }
      function def(name, w, h, fn) {
        for (let ph = 0; ph < 2; ph++) {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          fn(c.getContext("2d"), ph);
          tiles[name + "#" + ph] = c;
        }
      }
      function defD(name, fn) {
        def(name, TW, TH, (g, ph) => {
          fn(g, ph);
          g.globalCompositeOperation = "destination-in";
          g.drawImage(mask, 0, 0);
        });
      }
      function defDpx(name, fn) {
        defD(name, (g, ph) => {
          for (let y = 0; y < TH; y++)
            for (let x = TW / 2 - hw(y); x < TW / 2 + hw(y); x++)
              P(g, fn(x, y, ph), x, y);
        });
      }

      // ---- ground tiles ----
      [0, 1, 2].forEach((i) =>
        defD("g" + i, (g) => {
          P(g, COL.grass, 0, 0, TW, TH);
          for (let k = 0; k < 5; k++) {
            const h = hash(k + i * 7, i);
            P(g, COL.grassD, 4 + (h % 24), 3 + ((h >> 5) % 10), 2, 1);
          }
          P(g, COL.grassL, 8 + i * 6, 6 + i, 1, 1);
        }),
      );
      defD("tg", (g, ph) => {
        P(g, COL.grass, 0, 0, TW, TH);
        P(g, COL.tall, 0, 4, TW, 12);
        for (let x = 2; x < TW; x += 5) {
          P(g, COL.tall, x + ph, 3, 2, 1);
          P(g, COL.tallD, x + 1, 13, 1, 2);
        }
        [7, 15, 23].forEach((x) => P(g, COL.tallL, x + ph, 7, 1, 4));
      });
      [
        ["fR", COL.verm],
        ["fY", COL.saff],
        ["fW", "#FFFFFF"],
      ].forEach(([n, c]) =>
        defD(n, (g, ph) => {
          P(g, COL.grass, 0, 0, TW, TH);
          P(g, COL.grassD, 7, 11, 2, 1);
          P(g, COL.grassD, 24, 5, 2, 1);
          P(g, c, 13 + ph, 5, 4, 4);
          P(g, c === COL.saff ? COL.verm : COL.saff, 14 + ph, 6, 2, 2);
          P(g, COL.tallD, 15, 9, 1, 3);
        }),
      );
      // flower fields, floaroma-style bulb clusters
      function bulb(g, c, x, y) {
        P(g, COL.grassD, x + 1, y + 4, 3, 1); // ground shadow
        P(g, c, x, y + 1, 5, 3);
        P(g, c, x + 1, y, 3, 5);
        P(g, "#FFFFFF", x + 1, y + 1, 2, 1); // top-left sheen
        P(g, c === COL.saff ? COL.verm : COL.saff, x + 2, y + 2, 1, 1);
      }
      [0, 1].forEach((i) =>
        defD("ff" + i, (g, ph) => {
          P(g, COL.grass, 0, 0, TW, TH);
          const cols = i
            ? [COL.saff, "#FFFFFF", COL.verm, COL.saff]
            : [COL.verm, COL.saff, "#FFFFFF", COL.verm];
          [
            [5, 3],
            [18, 6],
            [10, 9],
            [23, 10],
          ].forEach((p, k) =>
            bulb(g, cols[k], p[0] + (k % 2 ? ph : -ph), p[1]),
          );
        }),
      );
      defD("rd", (g) => {
        P(g, COL.road, 0, 0, TW, TH);
        [
          [6, 4],
          [19, 8],
          [26, 11],
          [11, 12],
          [22, 3],
        ].forEach((p) => P(g, COL.roadL, p[0], p[1], 2, 1));
      });
      defDpx("cwV", (x, y) => ((x + 2 * y) % 14 < 6 ? COL.foam : COL.road));
      defDpx("cwH", (x, y) =>
        (x - 2 * y + 64) % 14 < 6 ? COL.foam : COL.road,
      );
      const TCOTTA = [
        "#CE6B47",
        "#CE6B47",
        "#CE6B47",
        "#DD7E58",
        "#9EA6AD",
        "#B8B2A6",
      ];
      [0, 1, 2].forEach((i) =>
        defD("sw" + i, (g) => {
          for (let y = 0; y < TH; y++)
            for (let x = TW / 2 - hw(y); x < TW / 2 + hw(y); x++) {
              const u = Math.floor((x + 2 * y) / 16),
                v = Math.floor((x - 2 * y + 64) / 16);
              const seam = (x + 2 * y) % 16 < 1 || (x - 2 * y + 64) % 16 < 1;
              P(
                g,
                seam ? "#5F564C" : TCOTTA[hash(u + i * 5, v + i * 3) % 6],
                x,
                y,
              );
            }
          for (let y = TH - 4; y < TH; y++) {
            P(g, "#8F3F26", TW / 2 - hw(y), y, 2, 1);
            P(g, "#8F3F26", TW / 2 + hw(y) - 2, y, 2, 1);
          }
        }),
      );
      defD("pd", (g) => {
        P(g, COL.pad, 0, 0, TW, TH);
        [
          [8, 5],
          [20, 9],
          [14, 12],
          [25, 6],
        ].forEach((p) => P(g, COL.padD, p[0], p[1], 2, 1));
      });
      defD("sd", (g) => {
        P(g, COL.sand, 0, 0, TW, TH);
        [
          [5, 6],
          [16, 3],
          [26, 8],
          [11, 11],
          [21, 13],
        ].forEach((p) => P(g, COL.sandD, p[0], p[1], 2, 1));
      });
      defD("tr", (g) => {
        P(g, "#BBA98A", 0, 0, TW, TH);
        [
          [6, 4],
          [17, 7],
          [25, 10],
          [11, 11],
          [21, 3],
        ].forEach((p) => P(g, "#9C8B70", p[0], p[1], 2, 1));
        P(g, "#D2C3A4", 14, 6, 2, 1);
        P(g, "#D2C3A4", 8, 9, 1, 1);
      });
      defD("pv", (g) => {
        P(g, "#9EA6AD", 0, 0, TW, TH);
        [
          [7, 5],
          [19, 8],
          [13, 12],
          [24, 4],
        ].forEach((p) => P(g, "#8C9096", p[0], p[1], 3, 1));
        for (let y = TH - 3; y < TH; y++) {
          P(g, "#7C848C", TW / 2 - hw(y), y, 2, 1);
          P(g, "#7C848C", TW / 2 + hw(y) - 2, y, 2, 1);
        }
      });
      [0, 1].forEach((i) =>
        defD("w" + i, (g, ph) => {
          P(g, COL.water, 0, 0, TW, TH);
          P(g, COL.waterL, 6 + i * 8 + ph * 2, 5 + i * 3, 5, 1);
          P(g, COL.waterL, 20 - i * 6 - ph * 2, 10 - i * 4, 4, 1);
        }),
      );
      defD("surf", (g, ph) => {
        P(g, COL.water, 0, 0, TW, TH);
        P(g, COL.foam, 0, 0, TW, 3 - ph);
        P(g, COL.waterHL, 0, 3 - ph, TW, 2);
        P(g, COL.waterL, 12 + ph * 4, 9, 6, 1);
      });
      defD("rk", (g) => {
        P(g, COL.rock, 0, 0, TW, TH);
        P(g, COL.rockD, 8, 4, 1, 4);
        P(g, COL.rockD, 19, 9, 4, 1);
        P(g, COL.rockL, 23, 4, 2, 1);
        P(g, COL.rockL, 6, 10, 2, 1);
      });
      defD("rkD", (g) => {
        P(g, COL.rockD, 0, 0, TW, TH);
        P(g, COL.rockDD, 11, 5, 1, 4);
        P(g, COL.rockDD, 21, 9, 3, 1);
        P(g, COL.rockL, 7, 11, 2, 1);
      });
      defD("sn", (g) => {
        P(g, COL.snow, 0, 0, TW, TH);
        [
          [8, 5],
          [21, 8],
          [14, 11],
        ].forEach((p) => P(g, COL.snowD, p[0], p[1], 2, 1));
      });
      defDpx("bw", (x, y) => {
        const v = (x + 2 * y) % 8;
        return v < 1 ? "#523620" : v < 2 ? "#A87B4C" : "#8A6238";
      });
      defD("wfF", (g, ph) => {
        P(g, COL.water, 0, 0, TW, TH);
        P(g, COL.foam, 6 + ph, 3, 5, 2);
        P(g, COL.foam, 17 - ph, 6, 6, 2);
        P(g, COL.foam, 10 + ph, 10, 5, 2);
        P(g, COL.waterHL, 22 - ph * 2, 11, 4, 1);
      });

      // ---- object sprites: volumetric, shadowed ----
      // big lobed tree, 24x32
      def("tree", 24, 32, (g, ph) => {
        const w = ph;
        E(g, COL.sh, 12, 29, 9, 2); // drop shadow
        P(g, COL.out, 10, 21, 5, 8);
        P(g, COL.trunk, 11, 21, 3, 7);
        P(g, COL.trunkD, 11, 26, 3, 2);
        E(g, COL.out, 12 + w, 9, 10, 8);
        E(g, COL.out, 6 + w, 15, 7, 6);
        E(g, COL.out, 18 + w, 15, 7, 6);
        E(g, COL.leafA, 12 + w, 9, 9, 7);
        E(g, COL.leafA, 6 + w, 15, 6, 5);
        E(g, COL.leafA, 18 + w, 15, 6, 5);
        E(g, COL.leafB, 6 + w, 17, 5, 3);
        E(g, COL.leafB, 18 + w, 17, 5, 3);
        E(g, COL.leafB, 12 + w, 14, 4, 3);
        E(g, COL.leafDk, 12 + w, 19, 6, 2);
        E(g, COL.leafDk, 4 + w, 18, 3, 2);
        E(g, COL.leafDk, 20 + w, 18, 3, 2);
        E(g, COL.leafHi, 9 + w, 6, 4, 3);
        E(g, COL.leafHi, 4 + w, 13, 3, 2);
        E(g, COL.leafHi, 16 + w, 12, 2, 1);
        P(g, COL.leafDk, 12 + w, 12, 1, 4); // lobe cleft
      });
      // bonsai-round street tree / bush, 16x18
      def("streetTree", 16, 18, (g, ph) => {
        E(g, COL.sh, 8, 16, 6, 1);
        P(g, COL.out, 6, 11, 4, 5);
        P(g, COL.trunk, 7, 11, 2, 4);
        E(g, COL.out, 8 + ph, 7, 7, 6);
        E(g, COL.leafA, 8 + ph, 6, 6, 5);
        E(g, COL.leafB, 8 + ph, 9, 5, 3);
        E(g, COL.leafDk, 8 + ph, 11, 4, 1);
        E(g, COL.leafHi, 5 + ph, 4, 3, 2);
      });
      // bulb flower plant, 12x14
      [
        ["bR", COL.verm],
        ["bY", COL.saff],
        ["bW", "#FFFFFF"],
      ].forEach(([n, c]) =>
        def(n, 12, 14, (g, ph) => {
          E(g, COL.sh, 6, 12, 4, 1);
          P(g, COL.tallD, 5, 8, 2, 4);
          E(g, COL.out, 6 + ph, 5, 5, 4);
          E(g, c, 6 + ph, 5, 4, 3);
          E(g, shade(c === "#FFFFFF" ? "#DDDDDD" : c, 0.7), 7, 7, 3, 1);
          P(g, "#FFFFFF", 4, 3, 2, 1);
          P(g, c === COL.saff ? COL.verm : COL.saff, 6, 5, 1, 1);
        }),
      );
      // boulders
      def("boulder", 16, 14, (g) => {
        E(g, COL.sh, 8, 12, 6, 2);
        E(g, COL.out, 8, 6, 7, 6);
        E(g, COL.rock, 8, 6, 6, 5);
        E(g, COL.rockD, 9, 8, 5, 3);
        E(g, COL.rockDD, 9, 10, 4, 1);
        E(g, COL.rockL, 5, 4, 3, 2);
      });
      def("rockW", 16, 14, (g) => {
        E(g, COL.out, 8, 6, 7, 6);
        E(g, COL.rock, 8, 6, 6, 5);
        E(g, COL.rockD, 9, 8, 5, 3);
        E(g, COL.rockL, 5, 4, 3, 2);
        P(g, COL.waterHL, 1, 10, 14, 2);
        P(g, COL.foam, 2, 9, 4, 1);
        P(g, COL.foam, 10, 9, 4, 1);
      });
      def("palm", 38, 58, (g, ph) => {
        E(g, COL.sh, 13, 56, 11, 2);
        for (let t = 0; t <= 40; t++) {
          // curved trunk, leaning east
          const y = 54 - t,
            xo = 10 + Math.round(6 * Math.pow(t / 40, 1.8));
          P(g, COL.out, xo, y, 5, 1);
          P(g, "#8A6238", xo + 1, y, 3, 1);
          if (t % 6 === 2) P(g, COL.trunkD, xo + 1, y, 3, 1);
        }
        const fr = (pts) => {
          // drooping frond: dark under, lit top
          pts.forEach((p) =>
            P(g, COL.leafDk, 19 + ph + p[0], 13 + p[1] + 1, 4, 2),
          );
          pts.forEach((p) => P(g, COL.leafA, 19 + ph + p[0], 13 + p[1], 4, 1));
        };
        fr([
          [1, -1],
          [5, 0],
          [9, 2],
          [12, 5],
          [14, 9],
        ]); // R
        fr([
          [-5, -1],
          [-9, 0],
          [-13, 2],
          [-16, 5],
          [-18, 9],
        ]); // L
        fr([
          [1, -4],
          [4, -6],
          [8, -6],
          [11, -4],
        ]); // UR
        fr([
          [-5, -4],
          [-8, -6],
          [-12, -6],
          [-15, -4],
        ]); // UL
        fr([
          [2, 1],
          [5, 4],
          [7, 8],
          [8, 12],
        ]); // DR
        fr([
          [-6, 1],
          [-9, 4],
          [-11, 8],
          [-12, 12],
        ]); // DL
        P(g, COL.out, 15, 14, 8, 5); // coconut pair
        P(g, COL.trunk, 16, 15, 3, 3);
        P(g, COL.trunkD, 19, 15, 3, 3);
      });
      // sprite name -> pixel column that sits over the object's tile centre
      const ANCHORX = {};
      // iso-box cars with shadows
      function rhomb(g, x0, y0, a, b, c) {
        g.fillStyle = c;
        for (let t = 0; t < a + b - 1; t++) {
          // solid row spans, no checkerboard gaps
          const iMin = Math.max(0, t - b + 1),
            iMax = Math.min(a - 1, t);
          const xL = x0 + 2 * (2 * iMin - t),
            xR = x0 + 2 * (2 * iMax - t);
          g.fillRect(xL, y0 + t, xR - xL + 2, 1);
        }
      }
      function isoBox(g, x0, y0, a, b, h, cT, cL, cR) {
        g.fillStyle = cL;
        for (let i = 0; i < a; i++)
          g.fillRect(x0 + 2 * i - 2 * (b - 1), y0 + i + b, 2, h);
        g.fillStyle = cR;
        for (let j = 0; j < b; j++)
          g.fillRect(x0 + 2 * (a - 1) - 2 * j, y0 + a + j, 2, h);
        rhomb(g, x0, y0, a, b, cT);
      }
      // Cars are baked at NYAW yaw steps so they can rotate through a turn
      // instead of snapping between two axis-aligned sprites. Sprite units are
      // eighths of a tile, the same as isoBox: screen x = 2*(ux-uy), y = ux+uy.
      const NYAW = 32;
      const CAR_W = 36,
        CAR_H = 30,
        CAR_OX = 18, // sprite pixel that carries the body's base centre...
        CAR_OY = 17,
        CAR_DY = CAR_H - CAR_OY - 3.5; // ...placed exactly where the old sprites put it
      const isoX = (ux, uy) => CAR_OX + 2 * (ux - uy),
        isoY = (ux, uy, uz) => CAR_OY + ux + uy - uz;
      // scanline fill, snapped to whole pixels — no canvas AA, stays pixel art
      function fillPoly(g, pts, col) {
        g.fillStyle = col;
        let yLo = Infinity,
          yHi = -Infinity;
        for (const p of pts) {
          if (p[1] < yLo) yLo = p[1];
          if (p[1] > yHi) yHi = p[1];
        }
        for (let y = Math.floor(yLo); y <= Math.ceil(yHi); y++) {
          const yc = y + 0.5,
            xs = [];
          for (let i = 0; i < pts.length; i++) {
            const [ax, ay] = pts[i],
              [bx, by] = pts[(i + 1) % pts.length];
            if (ay === by || yc < Math.min(ay, by) || yc >= Math.max(ay, by))
              continue;
            xs.push(ax + ((yc - ay) / (by - ay)) * (bx - ax));
          }
          if (xs.length < 2) continue;
          xs.sort((p, q) => p - q);
          for (let i = 0; i + 1 < xs.length; i += 2) {
            const xL = Math.round(xs[i]),
              xR = Math.round(xs[i + 1]);
            const w = Math.max(xs[i + 1] - xs[i] > 0.25 ? 1 : 0, xR - xL);
            if (w > 0) g.fillRect(xL, y, w, 1);
          }
        }
      }
      // Extruded box at yaw th about the sprite-space origin (ox,oy): local +x is
      // forward (length L), +y is right (W), and the box is offset by (fx,fy)
      // along those local axes before the spin — so a crane's jib can hang off
      // the mast's pivot the same way a cabin sits on a chassis. Each wall is
      // shaded from a continuous ramp keyed on its outward normal, so a face
      // darkens smoothly as it turns away instead of snapping between two tones.
      function isoPrism(g, ox, oy, th, fx, fy, L, W, z0, z1, cTop, cWall) {
        const co = Math.cos(th),
          si = Math.sin(th);
        const X = (ux, uy) => ox + 2 * (ux - uy),
          Y = (ux, uy, uz) => oy + ux + uy - uz;
        const base = [
          [L / 2, -W / 2],
          [L / 2, W / 2],
          [-L / 2, W / 2],
          [-L / 2, -W / 2],
        ].map(([lx, ly]) => [
          (lx + fx) * co - (ly + fy) * si,
          (lx + fx) * si + (ly + fy) * co,
        ]);
        const walls = base.map((p, i) => {
          const q = base[(i + 1) % 4];
          // outward normal of edge p->q, and its depth toward the camera
          const ex = q[0] - p[0],
            ey = q[1] - p[1],
            el = Math.hypot(ex, ey);
          const nx = ey / el,
            ny = -ex / el;
          const t = (ny - nx) / Math.SQRT2; // +y face lit, +x face shaded
          return {
            d: p[0] + p[1] + q[0] + q[1],
            f: cWall(t),
            pts: [
              [X(p[0], p[1]), Y(p[0], p[1], z0)],
              [X(q[0], q[1]), Y(q[0], q[1], z0)],
              [X(q[0], q[1]), Y(q[0], q[1], z1)],
              [X(p[0], p[1]), Y(p[0], p[1], z1)],
            ],
          };
        });
        walls.sort((a, b) => a.d - b.d); // painter: far walls first, roof last
        for (const wl of walls) fillPoly(g, wl.pts, wl.f);
        fillPoly(
          g,
          base.map((p) => [X(p[0], p[1]), Y(p[0], p[1], z1)]),
          cTop,
        );
        return base;
      }
      // a car's body and cabin are prisms about the car sprite's own origin
      const carPrism = (g, th, L, W, z0, z1, cTop, cWall) =>
        isoPrism(g, CAR_OX, CAR_OY, th, 0, 0, L, W, z0, z1, cTop, cWall);
      const CARCOLS = [COL.verm, COL.saff, COL.cerl, COL.white];
      const carName = (n, k) => "car" + n + "y" + k;
      CARCOLS.forEach((c, n) => {
        for (let k = 0; k < NYAW; k++) {
          const th = (k * 2 * Math.PI) / NYAW;
          def(carName(n, k), CAR_W, CAR_H, (g) => {
            const co = Math.cos(th),
              si = Math.sin(th);
            // shadow: flat puddle sized to the footprint's projected extent, so
            // it narrows as the car turns end-on to the camera
            let shW = 0,
              shH = 0;
            for (const [lx, ly] of [
              [4.5, -2],
              [4.5, 2],
              [-4.5, 2],
              [-4.5, -2],
            ]) {
              const ux = lx * co - ly * si,
                uy = lx * si + ly * co;
              shW = Math.max(shW, Math.abs(2 * (ux - uy)));
              shH = Math.max(shH, Math.abs(ux + uy));
            }
            E(
              g,
              COL.sh,
              CAR_OX,
              CAR_OY + 6,
              Math.max(3, Math.round(shW) - 1),
              Math.max(2, Math.round(shH * 0.5) - 1),
            );
            // Only the wheels on the camera-facing flank may be drawn over the
            // body; the far flank's pair goes behind it, or they show through the
            // car. Which flank that is depends on yaw: the local +y side faces the
            // camera when its outward normal (-sin, cos) points down-screen.
            const side = co - si;
            const wheels = [
              [2.5, -1.5],
              [2.5, 1.5],
              [-2.5, 1.5],
              [-2.5, -1.5],
            ].map(([lx, ly]) => {
              const ux = lx * co - ly * si,
                uy = lx * si + ly * co;
              return {
                // end-on (side == 0): both flanks are edge-on, so fall back to
                // depth and let the near end's pair sit in front
                v: Math.abs(side) < 1e-6 ? ux + uy : ly * side,
                x: isoX(ux, uy),
                y: isoY(ux, uy, 0),
              };
            });
            const wheel = (w) => {
              g.fillStyle = COL.wheel;
              g.fillRect(Math.round(w.x) - 1, Math.round(w.y) - 1, 3, 4);
            };
            wheels.filter((w) => w.v <= 0).forEach(wheel); // far flank, behind body
            carPrism(g, th, 9, 4, 0, 4, c, (t) => shade(c, 0.635 + 0.12 * t));
            wheels.filter((w) => w.v > 0).forEach(wheel); // near flank, in front
            carPrism(g, th, 5, 2, 4, 6, shade(c, 0.9), (t) =>
              shade(COL.win, 0.9 + 0.1414 * t),
            );
          });
          ANCHORX[carName(n, k)] = CAR_OX;
        }
      });

      // parametric low-rise storefront: footprint tx x ty tiles, colored roof,
      // flat(+AC)/hipped, optional striped awning; anchored at south corner
      function buildingSprite(nm, o) {
        const a = 8 * o.tx,
          b = 8 * o.ty,
          h = o.h;
        const nT = o.layers || (o.tier ? 1 : 0);
        const topRoom =
          (nT ? Math.floor(h * 0.95) : 0) +
          (o.spire ? 10 : 0) +
          (o.garden ? 8 : 0) +
          (o.cap ? 24 : 0) +
          (o.round ? 4 : 0) +
          (o.ell ? 10 : 0);
        const x0 = 2 * b,
          w = 2 * (a + b) + 2,
          y0 = 6 + topRoom;
        ANCHORX[nm] = 2 * a + 1;
        const PAR = 4;
        def(nm, w, y0 + a + b + h + 2, (g, ph) => {
          const cx = x0 + a - b + 1,
            cyc = y0 + ((a + b) >> 1); // footprint center (px)

          // ================= round body: full drum =================
          if (o.round) {
            const r = Math.min(a, b) + 6,
              ry = r >> 1;
            for (let i = -r; i <= r; i++) {
              const ed = Math.floor(
                ry * Math.sqrt(Math.max(0, 1 - (i * i) / (r * r))),
              );
              const c =
                i < -r / 3
                  ? shade(o.body, 1.08)
                  : i > r / 3
                    ? shade(o.body, 0.72)
                    : o.body;
              P(g, c, cx + i, cyc - h + ed, 1, h);
              P(g, COL.out, cx + i, cyc + ed - 1, 1, 1); // base rim
            }
            E(g, o.accent, cx, cyc - h, r, ry); // parapet ring
            E(g, shade(o.body, 0.7), cx, cyc - h, r - 3, Math.max(2, ry - 2));
            for (const bandY of [Math.floor(h * 0.3), Math.floor(h * 0.6)])
              for (let i = -r + 4; i <= r - 5; i += 5) {
                const ed = Math.floor(ry * Math.sqrt(1 - (i * i) / (r * r)));
                P(g, COL.win, cx + i, cyc - h + ed + bandY, 2, 3);
              }
            for (let i = -2; i <= 2; i++) {
              // entrance
              const ed = Math.floor(ry * Math.sqrt(1 - (i * i) / (r * r)));
              P(g, "#1E2124", cx + i, cyc - h + ed + h - 7, 1, 7);
            }
            if (o.garden)
              [
                [-8, -2],
                [7, -3],
                [0, 2],
              ].forEach(([dx, dy], k) => {
                E(g, COL.leafDk, cx + dx, cyc - h + dy, 4, 2);
                E(g, COL.leafA, cx + dx, cyc - h + dy - 1 - (ph & k & 1), 4, 2);
              });
            if (o.spire) {
              P(g, COL.out, cx, cyc - h - ry - 8, 2, 9);
              P(g, ph ? COL.verm : COL.foam, cx, cyc - h - ry - 10, 2, 2);
            }
            return;
          }

          // ================= L-shape: NW tower + full-width south block =================
          if (o.ell) {
            const ah = a >> 1,
              bh = b >> 1,
              bb = b - bh;
            isoBox(
              g,
              x0,
              y0 - 8,
              ah,
              bh,
              h + 8,
              shade(o.body, 0.62),
              shade(o.body, 1.05),
              shade(o.body, 0.8),
            ); // tower
            for (let i = 0; i < ah; i++)
              P(g, o.accent, x0 + 2 * i - 2 * (bh - 1), y0 - 8 + i + bh, 2, 3);
            for (let j = 1; j < bh - 1; j += 2)
              P(
                g,
                COL.win,
                x0 + 2 * (ah - 1) - 2 * j,
                y0 - 8 + ah + j + 4,
                2,
                h,
              );
            const sx0 = x0 - 2 * bh,
              sy0 = y0 + bh;
            isoBox(
              g,
              sx0,
              sy0,
              a,
              bb,
              h,
              shade(o.body, 0.7),
              o.body,
              shade(o.body, 0.78),
            ); // south block
            const L2 = (i) => [sx0 + 2 * i - 2 * (bb - 1), sy0 + i + bb];
            const R2 = (j) => [sx0 + 2 * (a - 1) - 2 * j, sy0 + a + j];
            for (let i = 0; i < a; i++) {
              const p = L2(i);
              P(g, o.accent, p[0], p[1], 2, PAR);
            }
            for (let j = 0; j < bb; j++) {
              const p = R2(j);
              P(g, shade(o.accent, 0.82), p[0], p[1], 2, PAR);
            }
            for (let i = 1; i < a - 1; i++) {
              const p = L2(i);
              P(g, "#2A2E33", p[0], p[1] + h - 7, 2, 7);
              for (let wy = PAR + 2; wy <= h - 11; wy += 5)
                P(
                  g,
                  i & 1 ? COL.win : shade("#7FDCFF", 0.85),
                  p[0],
                  p[1] + wy,
                  2,
                  3,
                );
            }
            const dmm = a >> 1;
            for (let i = dmm - 1; i <= dmm; i++) {
              const p = L2(i);
              P(g, "#1E2124", p[0], p[1] + h - 7, 2, 7);
            }
            for (let j = 1; j < bb - 1; j++) {
              const p = R2(j);
              for (let wy = PAR + 2; wy <= h - 6; wy += 5)

            }
            g.fillStyle = COL.out;
            for (let i = 0; i < a; i++) {
              const p = L2(i);
              g.fillRect(p[0], p[1] + h - 1, 2, 1);
            }
            for (let j = 0; j < bb; j++) {
              const p = R2(j);

          }

          // ================= cooper: perforated metal + diagonal gash =================

          // ================= prism body =================
          isoBox(
            g,
            x0,
            y0,
            a,
            b,
            h,
            shade(o.body, 0.7),
            o.body,
            shade(o.body, 0.78),
          );
          const L = (i) => [x0 + 2 * i - 2 * (b - 1), y0 + i + b];
          const R = (j) => [x0 + 2 * (a - 1) - 2 * j, y0 + a + j];

          // ---- layered setbacks ----
          let rise = 0,
            cL = 0;
          for (let k = 1; k <= nT; k++) {
            const c = 3 * k,
              ak = a - 2 * c,
              bk = b - 2 * c;
            if (ak < 4 || bk < 4) break;
            const hk = Math.max(5, Math.floor(h * (0.5 - 0.15 * (k - 1))));

            cL = c;
            isoBox(
              g,
              x0,
              y0 + 2 * c - rise,
              ak,
              bk,
              hk,
              shade(o.body, 0.62),
              shade(o.body, 0.92),
              shade(o.body, 0.72),
            );
            for (let i = 0; i < ak; i++)
              P(
                g,
                o.accent,
                x0 + 2 * i - 2 * (bk - 1),
                y0 + 2 * c - rise + i + bk,
                2,
                2,
              );
            for (let j = 1; j < bk; j += 2)
              P(
                g,
                COL.win,
                x0 + 2 * (ak - 1) - 2 * j,
                y0 + 2 * c - rise + ak + j + 2,
                2,
                Math.max(2, hk - 4),
              );
          }
          if (!nT && !o.cap && !o.garden) {
            const rcx = x0 + 2 * (a >> 1) - 2 * (b >> 1),
              rcy = y0 + (a >> 1) + (b >> 1) - 4;
            isoBox(g, rcx, rcy, 3, 3, 3, "#C6C0AE", "#9EA6AD", "#7C848C");
          }

          // ---- roof caps ----
          if (o.cap === "dome") {
            const dr = Math.min(a, b) * 2 - 14,
              ry2 = dr >> 1,
              dH = Math.floor(dr * 0.75);
            for (let i = -dr; i <= dr; i++) {
              const t = i / dr,
                q = Math.sqrt(Math.max(0, 1 - t * t));
              const ed = Math.floor(ry2 * q * 0.5),
                hg = Math.floor(dH * q);
              const c =
                t < -0.3
                  ? shade(o.accent, 1.15)
                  : t > 0.35
                    ? shade(o.accent, 0.72)
                    : o.accent;
              P(g, c, cx + i, cyc - hg, 1, hg + ed + 1); // column: silhouette to front rim
              P(g, shade(o.accent, 0.5), cx + i, cyc + ed, 1, 1); // base contact
            }
            for (const ri of [-(dr >> 1), 0, dr >> 1]) {
              // meridian ribs
              const q = Math.sqrt(1 - (ri * ri) / (dr * dr));
              P(
                g,
                shade(o.accent, 0.55),
                cx + ri,
                cyc - Math.floor(dH * q),
                1,
                Math.floor(dH * q) + Math.floor(ry2 * q * 0.5) + 1,
              );
            }
            P(g, COL.foam, cx, cyc - dH - 2, 2, 2); // finial
          } else if (o.cap === "pyr") {
            for (let k = 0; k < 3; k++) {
              const c = 2 + 2 * k,
                ak = a - 2 * c,
                bk = b - 2 * c;
              if (ak < 2 || bk < 2) break;
              isoBox(
                g,
                x0,
                y0 + 2 * c - 4 * (k + 1),
                ak,
                bk,
                4,
                shade(o.body, 0.8 - 0.06 * k),
                shade(o.body, 0.7 - 0.06 * k),
                shade(o.body, 0.56 - 0.06 * k),
              );
            }
            P(g, o.accent, x0, y0 + 12 - 13, 2, 2); // tip accent
          } else if (o.cap === "cyl") {
            const dr = Math.min(a, b),
              ry3 = dr >> 1,
              dh = 8;
            for (let i = -dr; i <= dr; i++) {
              const t = i / dr,
                q = Math.sqrt(Math.max(0, 1 - t * t));
              const ed = Math.floor(ry3 * q * 0.5);
              const c =
                t < -0.33
                  ? shade(o.accent, 1.06)
                  : t > 0.33
                    ? shade(o.accent, 0.7)
                    : shade(o.accent, 0.9);
              P(g, c, cx + i, cyc - dh + ed, 1, dh);
              P(g, shade(o.accent, 0.5), cx + i, cyc + ed - 1, 1, 1); // base contact
            }
            for (let i = -dr + 3; i <= dr - 4; i += 4) {
              const ed = Math.floor(
                (ry3 >> 1) * Math.sqrt(1 - (i * i) / (dr * dr)),
              );
              P(g, COL.win, cx + i, cyc - dh + ed + 2, 2, 3);
            }
            E(g, o.accent, cx, cyc - dh, dr, Math.max(2, ry3 >> 1)); // rim ring
            E(
              g,
              shade(o.body, 0.68),
              cx,
              cyc - dh,
              dr - 3,
              Math.max(1, (ry3 >> 1) - 1),
            );
          } else if (o.cap === "hex") {
            const hx = Math.min(a, b) + 2,

            P(g, o.accent, cx - hx + fw, cyc - 16, fw, 14);
            P(
              g,
              shade(o.accent, 0.7),
              cx - hx + 2 * fw,
              cyc - 14,
              2 * hx - 2 * fw,
              12,
            );
            P(g, COL.out, cx - hx + fw, cyc - 16, 1, 14);
            P(g, COL.out, cx - hx + 2 * fw, cyc - 16, 1, 14);
            for (let i = -hx + 2; i < hx - 2; i += 4)
              P(g, COL.win, cx + i, cyc - 9, 2, 3);

          }

          if (o.garden) {

            for (let k = 0; k < 12; k++) {
              // lawn mottling
              const ci = (k * 5 + 1) % (a - 5),
                cj = (k * 7 + 2) % (b - 5);
              P(g, "#1E9367", x0 + 2 * ci - 2 * cj, y0 + 4 + ci + cj, 2, 1);
            }
            for (
              let k = a >> 1;
              k < a - 3;
              k++ // paver path to the south corner
            )
              P(g, "#D6D0BE", x0, y0 + 2 * k, 2, 2);
            isoBox(g, x0, y0 + 2, a - 8, 2, 2, "#8A6238", "#6E4A2E", "#523620"); // NE hedge bed
            for (let i = 0; i < a - 8; i++) {
              const px = x0 + 2 * i - 1,
                py = y0 + 2 + i;
              P(g, COL.leafDk, px, py - 2, 2, 2);
              P(g, COL.leafA, px, py - 3 - (ph & i & 1), 2, 2);
            }
            isoBox(
              g,
              x0 - 2,
              y0 + 3,
              2,
              b - 8,
              2,
              "#8A6238",
              "#6E4A2E",
              "#523620",
            ); // NW hedge bed
            for (let j = 0; j < b - 8; j++) {
              const px = x0 - 2 * j - 3,
                py = y0 + 4 + j;
              P(g, COL.leafDk, px, py - 2, 2, 2);
              P(g, COL.leafA, px, py - 3 - (ph & j & 1), 2, 2);
            }
            [
              [6, 9],
              [10, 5],
              [12, 11],
            ].forEach(([ci, cj], k) => {
              // shrubs on the lawn
              const sx2 = x0 + 2 * ci - 2 * cj + 1,
                sy2 = y0 + ci + cj;
              E(g, COL.leafDk, sx2, sy2, 3, 2);
              E(g, COL.leafA, sx2, sy2 - 1 - (ph & k & 1), 3, 2);
              E(g, COL.leafHi, sx2 - 1, sy2 - 2, 1, 1);
            });
            const tcx = x0 + 1,
