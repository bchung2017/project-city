<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project City — Projects</title>
<style>
:root {
  --ink:        #073A3B;
  --viridian:   #00B7B9;
  --viridianHi: #25CDCE;
  --viridianDk: #008C8E;
  --pewter:     #F0EAD6;
  --pewterMid:  #D6D0BE;
  --pewterDk:   #B8B2A6;
  --cerulean:   #0096E6;
  --vermillion: #F02D0E;
  --saffron:    #FFCC0F;
  --blue:       #0090DC;
  --asphalt:    #3B3F44;
  --asphaltHi:  #474B50;
  --grass:      #27AE7E;
  --shadow:     rgba(7,58,59,0.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html, body { min-height: 100%; }
body {
  background: var(--cerulean);
  font: 700 13px/1.5 monospace;
  letter-spacing: 1px;
  color: var(--ink);
  /* right gutter reserves the fixed #pcnav column so it never covers content */
  padding: 56px 208px 40px 24px;
}
#tag {
  position: fixed; top: 10px; left: 12px;
  font: 700 11px/1 monospace; letter-spacing: 2px;
  color: #FFFFFF; text-shadow: 2px 2px 0 var(--ink);
  user-select: none; pointer-events: none; z-index: 10;
}
#status {
  position: fixed; top: 10px; right: 120px;
  font: 700 11px/1 monospace; letter-spacing: 2px;
  color: #FFFFFF; text-shadow: 2px 2px 0 var(--ink);
  z-index: 10;
}
#status .dot {
  display: inline-block; width: 8px; height: 8px;
  background: var(--saffron); margin-right: 6px;
  border: 1px solid var(--ink);
}
#status.idle .dot { background: var(--grass); }

button, input, textarea {
  font: 700 13px/1.4 monospace; letter-spacing: 1px; color: var(--ink);
  border: 2px solid var(--ink); background: var(--pewter);
  outline: none;
}
button {
  cursor: pointer; padding: 6px 12px; text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--shadow); transition: none;
}
button:hover { background: var(--saffron); }
button:active { transform: translate(2px, 2px); box-shadow: none; }
button.danger:hover { background: var(--vermillion); color: #FFFFFF; text-shadow: 2px 2px 0 var(--ink); }
button.ghost { background: var(--pewterMid); box-shadow: none; padding: 2px 8px; font-size: 11px; }
button.ghost:hover { background: var(--saffron); }
input:focus, textarea:focus { border-color: var(--saffron); }

/* header bar */
#bar {
  margin: 0 0 24px;
  background: var(--asphalt); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--shadow);
  padding: 14px 16px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
#bar h1 {
  font: 700 16px/1 monospace; letter-spacing: 2px; text-transform: uppercase;
  color: #FFFFFF; text-shadow: 2px 2px 0 var(--ink);
}
#bar form { display: flex; gap: 8px; margin-left: auto; }
#newTitle { padding: 6px 10px; width: 260px; }

/* project grid */
#grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px; align-content: start;
}
#empty {
  padding: 32px 16px;
  background: var(--pewter); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--shadow);
  text-transform: uppercase; letter-spacing: 2px; text-align: center;
}

/* project card */
.card {
  background: var(--pewter); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--shadow); padding: 12px;
  /* auto-fit stretches tracks to fill the row; without this a lone project
     would span an entire 4K monitor. */
  max-width: 760px;
}
.card.selected {
  border-color: var(--saffron);
  box-shadow: 3px 3px 0 var(--shadow), 0 0 0 3px var(--saffron);
}
.card-head {
  display: flex; align-items: flex-end; gap: 10px;
  border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 10px;
}
.card-title {
  font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
  cursor: pointer; flex: 1; word-break: break-word;
}
.card-title:hover { background: var(--saffron); }
.card-head input { flex: 1; padding: 2px 6px; min-width: 0; }
.tally {
  font-size: 11px; color: var(--ink); background: var(--pewterMid);
  border: 2px solid var(--ink); padding: 2px 6px; white-space: nowrap;
}
.tally.done { background: var(--grass); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }

/* iso building glyph — height tracks open items */
.iso { width: 40px; flex: none; align-self: flex-end; position: relative; }
.iso div { position: absolute; bottom: 0; }
.iso .roof, .iso .fL, .iso .fR { image-rendering: pixelated; }

/* todo list */
.items { list-style: none; }
.item { border: 2px solid var(--ink); background: #FFFFFF; margin-bottom: 8px; }
.item-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
.item.done .item-text { text-decoration: line-through; color: var(--pewterDk); }
.item-text { flex: 1; cursor: default; word-break: break-word; }
.cb {
  width: 18px; height: 18px; flex: none; cursor: pointer;
  border: 2px solid var(--ink); background: var(--pewter);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; color: var(--ink); user-select: none;
}
.item.done .cb { background: var(--saffron); }
.notes-toggle {
  width: 22px; height: 18px; flex: none; padding: 0;
  font-size: 10px; box-shadow: none; background: var(--pewterMid);
}
.notes-toggle.open { background: var(--viridian); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.item-notes { border-top: 2px solid var(--ink); background: var(--pewter); padding: 8px; }
.item-notes[hidden] { display: none; }
.item-notes textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: 6px 8px;
  background: #FFFFFF; display: block;
}
.item-notes .notes-foot { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
.notes-saved { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--viridianDk); }

/* schedule block — turns a todo into a time-sensitive goal. These four fields
   (created / start / target / predecessor) are the Gantt tuple; the chart is a
   view over them, so editing here is editing the future chart. */
.sched {
  border: 2px solid var(--ink); background: #FFFFFF;
  padding: 8px; margin-bottom: 8px;
  display: flex; flex-direction: column; gap: 7px;
}
.sched-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sched-k {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--viridianDk);
}
.sched-v { font-size: 11px; letter-spacing: 1px; }
.sched-v.none { color: var(--pewterDk); }
.sched-row label { display: flex; align-items: center; gap: 6px; }
.sched input[type=date], .sched select {
  font: 700 11px/1.4 monospace; letter-spacing: 1px; color: var(--ink);
  border: 2px solid var(--ink); background: var(--pewter);
  padding: 2px 4px; outline: none; cursor: pointer;
}
.sched input[type=date]:focus, .sched select:focus { border-color: var(--saffron); }
.sched .spacer { margin-left: auto; }
/* goal status — the one place a deadline is allowed to shout */
.chip {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  border: 2px solid var(--ink); padding: 2px 6px; white-space: nowrap;
  background: var(--pewterMid); color: var(--ink);
}
.chip.ok      { background: var(--viridian); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.chip.soon    { background: var(--saffron); }
.chip.overdue { background: var(--vermillion); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.chip.done    { background: var(--grass); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.chip.err     { background: var(--vermillion); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
/* an overdue item is worth seeing without opening the dropdown */
.item.late { border-color: var(--vermillion); box-shadow: inset 3px 0 0 var(--vermillion); }

/* completion 0.00 - 1.00; an item only becomes a story at 1.0 */
.pct { display: flex; align-items: center; gap: 6px; flex: none; }
.pct input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 72px; height: 10px; padding: 0; flex: none; cursor: pointer;
  background: var(--pewterMid); border: 2px solid var(--ink);
}
.pct input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 8px; height: 12px; background: var(--viridian);
  border: 2px solid var(--ink); cursor: pointer;
}
.pct input[type=range]::-moz-range-thumb {
  width: 8px; height: 12px; background: var(--viridian);
  border: 2px solid var(--ink); border-radius: 0; cursor: pointer;
}
.item.done .pct input[type=range]::-webkit-slider-thumb { background: var(--saffron); }
.item.done .pct input[type=range]::-moz-range-thumb { background: var(--saffron); }
.pct .pctv { font-size: 10px; width: 30px; text-align: right; color: var(--viridianDk); }
.item.done .pct .pctv { color: var(--ink); }

.add-item { display: flex; gap: 8px; margin-top: 4px; }
.add-item input { flex: 1; padding: 4px 8px; min-width: 0; }
.card-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 10px; }

/* logo: its own row — the card-foot is a single-line flex-end row and is full */
.logo-ctl {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--pewterDk);
}
.logo-cap {
  font: 700 10px/1 monospace; letter-spacing: 2px; text-transform: uppercase;
  color: var(--viridianDk); margin-right: 2px;
}
.logo-prev {
  width: 40px; height: 40px; flex: none; image-rendering: pixelated;
  border: 2px solid var(--ink); background: var(--pewterMid);
  box-shadow: 2px 2px 0 var(--shadow);
}
.logo-prev.bad { border-color: var(--vermillion); }
.logo-ctl input[type="range"] { width: 74px; padding: 0; accent-color: var(--viridian); }
.logo-lab {
  font: 700 10px/1 monospace; letter-spacing: 1px; color: var(--viridianDk);
  min-width: 30px;
}
.logo-err { font: 700 10px/1.3 monospace; color: var(--vermillion); max-width: 200px; }
a.city-link {
  font: 700 11px/1.4 monospace; letter-spacing: 1px; text-transform: uppercase;
  text-decoration: none; color: var(--ink); background: var(--pewterMid);
  border: 2px solid var(--ink); padding: 2px 8px; white-space: nowrap;
}
a.city-link:hover { background: var(--saffron); }
.city-tog { margin-right: auto; }
.card.selected { scroll-margin: 24px; }
.city-tog.on { background: var(--saffron); }
.city-tog.off { background: var(--pewterMid); color: var(--pewterDk); }
.stories { font-size: 11px; background: var(--viridian); color: #FFFFFF;
  text-shadow: 1px 1px 0 var(--ink); border: 2px solid var(--ink);
  padding: 2px 6px; white-space: nowrap; }
.del-x { width: 22px; height: 18px; flex: none; padding: 0; font-size: 10px; box-shadow: none; background: var(--pewterMid); }
.del-x:hover { background: var(--vermillion); color: #FFFFFF; }
/* The card's primary action: own full-width bar, not a chip in the foot row. */
.expand {
  display: block; width: 100%; margin-top: 10px; padding: 9px 10px;
  font: 700 14px/1 monospace; letter-spacing: 2px; text-transform: uppercase;
  color: var(--ink); background: var(--saffron);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer; text-align: center;
}
.expand:hover { background: var(--viridian); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.expand:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }

/* =================================================================
   FULL-SCREEN PROJECT MODAL — one project, every detail. Sits above
   #pcnav (z-index 50) so while open it genuinely owns the screen.
   Contents are rebuilt by renderModal() on every mutation, exactly
   like the cards, so the two can never disagree.
   ================================================================= */
#modal { position: fixed; inset: 0; z-index: 100; display: flex; background: rgba(7,58,59,0.86); }
#modal[hidden] { display: none; }
.modal-panel {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: var(--cerulean); border: 4px solid var(--ink);
}
.modal-head {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 14px 16px;
  background: var(--asphalt); border-bottom: 4px solid var(--ink);
}
.modal-titlewrap { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
.modal-title {
  font: 700 22px/1.15 monospace; letter-spacing: 3px; text-transform: uppercase;
  color: #FFFFFF; text-shadow: 3px 3px 0 var(--ink);
  cursor: pointer; word-break: break-word; align-self: flex-start;
}
.modal-title:hover { background: var(--saffron); color: var(--ink); text-shadow: none; }
.modal-titlewrap input { padding: 4px 8px; font-size: 18px; width: 100%; }
.modal-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.modal-close { background: var(--pewter); }
.modal-close:hover { background: var(--vermillion); color: #FFFFFF; text-shadow: 2px 2px 0 var(--ink); }

.modal-body {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px;
}
.modal-side { display: flex; flex-direction: column; gap: 16px; overflow: auto; }
.modal-main {
  min-height: 0; display: flex; flex-direction: column;
  background: var(--pewter); border: 3px solid var(--ink);
  box-shadow: 3px 3px 0 var(--shadow); padding: 12px;
}
/* the item list scrolls; the add-item form stays pinned to the bottom */
.modal-items { flex: 1; min-height: 0; overflow: auto; list-style: none; padding-right: 4px; }
.modal-main .add-item { margin-top: 10px; }
.modal-empty {
  padding: 24px 12px; text-align: center; text-transform: uppercase; letter-spacing: 2px;
  color: var(--pewterDk); border: 2px dashed var(--pewterDk);
}

.panel { background: var(--pewter); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow); padding: 12px; }
.panel h3, .modal-main h3 {
  font: 700 11px/1 monospace; letter-spacing: 3px; text-transform: uppercase;
  color: var(--viridianDk); margin-bottom: 10px;
}
.stat {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 5px 0; border-bottom: 2px solid var(--pewterMid);
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
}
.stat:last-child { border-bottom: none; }
.stat span { color: var(--viridianDk); }
.stat b { font-size: 12px; text-align: right; }
.stat.warn b { color: var(--vermillion); }
.stat.good b { color: var(--grass); }
.bar { height: 16px; border: 2px solid var(--ink); background: #FFFFFF; margin-bottom: 10px; }
.bar i { display: block; height: 100%; background: var(--viridian); }
.bar i.full { background: var(--saffron); }
.modal-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.modal-actions button, .modal-actions a.city-link { text-align: center; padding: 6px 10px; font-size: 11px; }
/* the card footer pushes the city toggle left with margin-right:auto; in this
   column that would collapse it to its text width instead of filling the rail */
.modal-actions .city-tog { margin-right: 0; }

/* every note written on an item, gathered in the rail — a project's notes are
   otherwise buried one dropdown at a time. Clicking one opens it in the list. */
.notebook { display: flex; flex-direction: column; gap: 8px; }
.note-lite {
  border: 2px solid var(--ink); background: #FFFFFF; padding: 6px 8px; cursor: pointer;
}
.note-lite:hover { background: var(--saffron); }
.note-lite b {
  display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  word-break: break-word;
}
.note-lite.done b { text-decoration: line-through; color: var(--pewterDk); }
.note-lite span {
  display: block; margin-top: 4px; font-weight: 400; font-size: 11px;
  color: var(--asphalt); white-space: pre-wrap; word-break: break-word;
}

@media (max-width: 900px) {
  /* One column: the whole body scrolls as a single page. align-content:start lets
     the rows take their natural height — without it the grid squeezes them to fit
     and the rail becomes a nested scroller that hides the panels below Progress. */
  .modal-body { grid-template-columns: 1fr; overflow: auto; align-content: start; }
  .modal-side { overflow: visible; }
  .modal-main { min-height: 60vh; }
}

/* =================================================================
   TAGS — a per-project vocabulary. The project owns the tag bodies
   (name + color); an item only holds ids, so a rename or a recolor
   moves through every chip at once and can never leave a stale copy.
   ================================================================= */
.tagbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  border-bottom: 2px solid var(--pewterMid); padding-bottom: 10px; margin-bottom: 10px;
}
.tagbar-k {
  font: 700 10px/1 monospace; letter-spacing: 3px; text-transform: uppercase;
  color: var(--viridianDk); margin-right: 2px;
}
.tagbar .none { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--pewterDk); }
.tg {
  display: inline-flex; align-items: center; gap: 5px;
  font: 700 10px/1 monospace; letter-spacing: 2px; text-transform: uppercase;
  border: 2px solid var(--ink); padding: 3px 5px; white-space: nowrap;
}
.tg .tg-n { opacity: 0.72; font-size: 9px; }
.tg-b {
  border: none; background: transparent; box-shadow: none;
  font: 700 10px/1 monospace; padding: 0 1px; color: inherit; cursor: pointer;
}
.tg-b:hover { background: transparent; color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
/* the tag manager's own chips are buttons: click to apply/unapply on nothing,
   the pencil edits, the x deletes the tag from the project entirely */
.tg-del:hover { text-shadow: 1px 1px 0 var(--vermillion); }
.tag-form { display: flex; align-items: center; gap: 5px; }
.tag-form input[type=text] { padding: 2px 6px; width: 118px; font-size: 11px; }
.tag-form input[type=color] {
  width: 26px; height: 22px; padding: 0; flex: none; cursor: pointer;
  border: 2px solid var(--ink); background: var(--pewter);
}

/* per-item chips + the picker that applies them */
.itemtags {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  padding: 0 8px 6px 34px;
}
.itemtags .none { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--pewterDk); }
.tag-add { height: 18px; padding: 0 6px; font-size: 10px; box-shadow: none; background: var(--pewterMid); }
.tag-add.open { background: var(--viridian); color: #FFFFFF; text-shadow: 1px 1px 0 var(--ink); }
.tagpick {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  border: 2px dashed var(--pewterDk); background: var(--pewter);
  padding: 6px; margin: 0 8px 8px 34px;
}
.tagpick .tg { cursor: pointer; opacity: 0.45; }
.tagpick .tg.on { opacity: 1; box-shadow: 2px 2px 0 var(--shadow); }
.tagpick .tg:hover { opacity: 1; }
.tagpick .none { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--pewterDk); }

/* ---- modal tabs + gantt -------------------------------------------------
   The chart is a *view of the items*, not a second store: it reads the same
   `projects` array the item list does, so editing a date under ITEMS moves the
   bar under GANTT on the very next render — no fetch, nothing to keep in sync. */
.modal-tabs { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 3px solid var(--ink); }
.modal-tabs button {
  font: inherit; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  padding: 7px 16px; cursor: pointer; color: var(--ink);
  border: 3px solid var(--ink); border-bottom: none; margin-right: 4px;
  background: var(--pewterMid);
}
.modal-tabs button.on { background: var(--saffron); box-shadow: inset 0 -4px 0 var(--vermillion); }
.modal-tabs button:not(.on):hover { background: var(--pewter); }
.modal-tabs .count { opacity: 0.6; margin-left: 6px; }

.gantt-scroll { flex: 1; min-height: 0; overflow: auto; }
.gantt { min-width: 520px; }
/* rows and axis share one grid, so the ticks stay glued to the bars at any width */
.gantt-row, .gantt-axis { display: grid; grid-template-columns: 190px 1fr; align-items: center; }
.gantt-axis { height: 24px; border-bottom: 2px solid var(--pewterDk); margin-bottom: 6px; }
.gantt-ticks { position: relative; height: 100%; }
.gantt-tick {
  position: absolute; top: 7px; transform: translateX(-50%);
  font-size: 9px; letter-spacing: 1px; color: var(--ink); opacity: 0.65; white-space: nowrap;
}
.gantt-tick::before {
  content: ''; position: absolute; left: 50%; bottom: -7px; width: 2px; height: 5px;
  background: var(--pewterDk);
}
.gantt-rows { position: relative; }
.gantt-row { height: 26px; }
.gantt-row:hover .gantt-label { color: var(--vermillion); }
.gantt-label {
  font-size: 11px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; cursor: pointer;
}
.gantt-row.done .gantt-label { opacity: 0.5; text-decoration: line-through; }
.gantt-track { position: relative; height: 26px; }
.gantt-track::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 0;
  border-top: 2px dotted var(--pewterMid);
}
.gantt-bar {
  position: absolute; top: 4px; height: 18px; box-sizing: border-box;
  border: 2px solid var(--ink); background: var(--pewterMid);
  min-width: 6px; cursor: pointer; overflow: hidden;
}
.gantt-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cerulean); display: block; }
.gantt-bar.done i { background: var(--grass); }
.gantt-bar.overdue { border-color: var(--vermillion); }
.gantt-bar.overdue i { background: var(--vermillion); }
.gantt-bar:hover { box-shadow: 2px 2px 0 var(--shadow); }
/* a lone date is a point in time, not a span — draw it as a milestone */
.gantt-mile {
  position: absolute; top: 7px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--saffron); border: 2px solid var(--ink); transform: rotate(45deg);
  box-sizing: border-box; cursor: pointer;
}

}

.gantt-links s { position: absolute; background: var(--ink); text-decoration: none; }

}
