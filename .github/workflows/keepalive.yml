name: keep-alive

# Free Supabase projects pause after ~1 week of zero activity (and Render's free
# web service sleeps after ~15 min). This pings /healthz — which runs one trivial
# SELECT 1 — often enough to keep both awake. Every 3 days is comfortably inside
# Supabase's ~7-day window.
#
# Setup: add a repository *variable* named HEALTHCHECK_URL
#   (Settings -> Secrets and variables -> Actions -> Variables) set to
#   https://<your-service>.onrender.com/healthz
# It's just a URL, so a variable (not a secret) is fine.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity;
# a manual "Run workflow" (workflow_dispatch) re-arms them.

on:
  schedule:
    - cron: "17 6 */3 * *" # 06:17 UTC every 3rd day
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.HEALTHCHECK_URL }}"
          if [ -z "$url" ]; then
            echo "::error::HEALTHCHECK_URL repository variable is not set"; exit 1
          fi
          # Render free instances cold-start (~30-60s) when asleep, so retry
          # patiently rather than failing the first slow response.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 6 --retry-all-errors --retry-delay 15 --max-time 90 "$url")
          echo "GET $url -> HTTP $code"
          test "$code" = "200"
